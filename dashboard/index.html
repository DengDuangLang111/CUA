<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiments on CUA Task Generation</title></head><body>

<style>
  :root{
    --bg:#f5f1e8; --surface:#fdfbf6; --ink:#20261f; --muted:#6b7263;
    --accent:#3d6b4f; --accent-ink:#2c5140; --line:#e2ddd0; --chip:#ece7da;
    --sel:#e3ead9; --good:#2e7d4f; --bad:#a83f45; --warn:#8f6a1f;
    --good-bg:#e4efe4; --bad-bg:#f6e8e8; --warn-bg:#f3ecd9; --code:#eae5d6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161a16; --surface:#1e241e; --ink:#e6e9e2; --muted:#9aa392;
      --accent:#7fb894; --accent-ink:#9ccbab; --line:#2e362d; --chip:#28302a;
      --sel:#26332a; --good:#6cc08b; --bad:#dd8287; --warn:#cfa458;
      --good-bg:#213228; --bad-bg:#342426; --warn-bg:#322b1c; --code:#272e26;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161a16; --surface:#1e241e; --ink:#e6e9e2; --muted:#9aa392;
    --accent:#7fb894; --accent-ink:#9ccbab; --line:#2e362d; --chip:#28302a;
    --sel:#26332a; --good:#6cc08b; --bad:#dd8287; --warn:#cfa458;
    --good-bg:#213228; --bad-bg:#342426; --warn-bg:#322b1c; --code:#272e26;
  }
  :root[data-theme="light"]{
    --bg:#f5f1e8; --surface:#fdfbf6; --ink:#20261f; --muted:#6b7263;
    --accent:#3d6b4f; --accent-ink:#2c5140; --line:#e2ddd0; --chip:#ece7da;
    --sel:#e3ead9; --good:#2e7d4f; --bad:#a83f45; --warn:#8f6a1f;
    --good-bg:#e4efe4; --bad-bg:#f6e8e8; --warn-bg:#f3ecd9; --code:#eae5d6;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); margin:0;
    font:14.5px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  .shell{display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; max-width:1400px; margin:0 auto;}
  /* sidebar */
  aside{border-right:1px solid var(--line); padding:22px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{padding:0 18px 14px; font-size:16.5px; font-weight:800; letter-spacing:-.2px;}
  .brand small{display:block; color:var(--muted); font-weight:600; font-size:11.5px; margin-top:2px;}
  .gl{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    font-weight:750; padding:14px 18px 4px;}
  aside a{display:flex; justify-content:space-between; gap:8px; padding:7px 15px 7px 18px; color:var(--ink);
    text-decoration:none; font-weight:600; font-size:13.5px; border-left:3px solid transparent; align-items:baseline;}
  aside a:hover{background:var(--chip);}
  aside a.sel{background:var(--sel); border-left-color:var(--accent);}
  aside a .r{color:var(--accent); font-variant-numeric:tabular-nums; font-weight:750; font-size:12.5px;}
  aside a .r.na{color:var(--muted); font-weight:600;}
  /* content */
  .content{padding:26px 30px 70px; min-width:0;}
  h1{font-size:22px; font-weight:800; letter-spacing:-.2px; margin:0 0 2px;}
  .lede{color:var(--muted); margin:4px 0 0; max-width:76ch; font-size:13.8px;}
  .pills{display:inline-flex; gap:6px; flex-wrap:wrap; margin-left:10px; vertical-align:2px;}
  .pill{display:inline-block; padding:1px 10px 2px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap;}
  .pill.good{background:var(--good-bg); color:var(--good);}
  .pill.bad{background:var(--bad-bg); color:var(--bad);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.dim{background:var(--chip); color:var(--muted);}
  /* tabs */
  .tabs{display:flex; gap:2px; margin:20px 0 0; border-bottom:1px solid var(--line);}
  .tabs button{font:700 13.5px/1 inherit; color:var(--muted); background:none; border:none;
    padding:10px 16px 11px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabs button.sel{color:var(--accent-ink); border-bottom-color:var(--accent);}
  .tabbody{padding-top:18px;}
  .seclabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--muted);
    font-weight:750; margin:22px 0 10px;}
  .seclabel:first-child{margin-top:0;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 15px 11px;}
  .card .k{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.4px; color:var(--good);}
  .card .k small{font-size:13px; color:var(--muted); font-weight:650;}
  .card .l{font-size:11.8px; color:var(--muted); margin-top:2px;}
  dl.conds{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px 16px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:0;}
  dt{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:750;}
  dd{margin:2px 0 0; font-size:13px; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px;}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:520px;}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
     text-align:left; font-weight:750; padding:9px 13px 7px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:8px 13px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  td.hl{color:var(--accent-ink); font-weight:750;}
  td .why{color:var(--muted); font-size:12.3px;}
  a.btn{display:inline-block; background:var(--accent); color:#fff; border-radius:8px; padding:8px 15px;
    font-weight:700; font-size:13px; text-decoration:none;}
  a.btn.ghost{background:var(--chip); color:var(--ink);}
  .trajframe{width:100%; height:78vh; border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:12px;}
  .note{font-size:12.3px; color:var(--muted); margin-top:8px; max-width:84ch;}
  code{background:var(--code); border-radius:5px; padding:1px 6px; font-size:12.4px;}
  select.arm{font:650 13px/1 inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:8px 11px; max-width:100%;}
  /* tier-3 matrix: one row per trained arm, one column per held-out task */
  th.task{text-align:center; padding:7px 6px 6px; font-size:10px; letter-spacing:.04em;}
  th.task small{display:block; font-weight:650; letter-spacing:0; text-transform:none; opacity:.8;}
  td.cell{text-align:center; padding:5px 6px;}
  td.cell a,td.cell span{display:block; border-radius:7px; padding:5px 2px 4px; font-weight:800;
    font-size:13px; text-decoration:none; line-height:1.15;}
  td.cell a:hover{outline:2px solid var(--accent); outline-offset:-2px;}
  .cpass{background:var(--good-bg); color:var(--good);}
  .cfail{background:var(--bad-bg); color:var(--bad);}
  .cnone{background:var(--chip); color:var(--muted);}
  td.cell small{display:block; font-weight:650; font-size:10px; opacity:.75;
    font-variant-numeric:tabular-nums;}
  .story{counter-reset:s; margin:10px 0 0; padding:0; list-style:none;}
  .story li{position:relative; padding:0 0 13px 38px; max-width:82ch; font-size:13.4px;}
  .story li::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:0;
    width:25px; height:25px; border-radius:99px; background:var(--sel); color:var(--accent-ink);
    font-weight:800; font-size:12.5px; display:flex; align-items:center; justify-content:center;}
  .flow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0 0; font-size:12.8px; font-weight:650;}
  .flow .n{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:5px 11px;}
  .flow .a{color:var(--muted);}
  @media (max-width:800px){
    .shell{grid-template-columns:1fr;}
    aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); padding-bottom:10px;}
  }
</style>
<div class="shell">
<aside id="nav"></aside>
<div class="content" id="content"></div>
</div>
<script>
/* live numbers: a WSL daemon recomputes dashboard/status.json every 5 min and
   pushes; Vercel redeploys from GitHub; this fetch patches the page on load. */
window.LIVE = null; window.SFT = null;
function pullLive(){
  fetch("status.json", {cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if (j && JSON.stringify(j) !== JSON.stringify(window.LIVE)){ window.LIVE=j; render(); }
  }).catch(()=>{});
  /* sft.json is written by a second daemon in its own clone: two writers, two
     files, so neither can ever clobber the other's keys on a raced push. */
  fetch("sft.json", {cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if (j && JSON.stringify(j) !== JSON.stringify(window.SFT)){ window.SFT=j; render(); }
  }).catch(()=>{});
}
pullLive(); setInterval(pullLive, 120000);
function lv(){ const s = window.LIVE && window.LIVE.v11; if(!s || !s.scored) return null;
  return {...s, rate: Math.round(100*s.passed/s.scored)}; }
/* per-run trajectory hosting (separate vercel projects; ALL scored tasks, screenshots recompressed) */
const T = {
  v11:        "traj/v11/index.html",   /* repo-hosted; the 5-min daemon refreshes it with the run */
  v8big:      "https://cua-traj-v8.vercel.app/v8big/index.html",
  v8nt5:      "https://cua-traj-v8.vercel.app/v8nt-opus5/index.html",
  v8nt46:     "https://cua-traj-v8.vercel.app/v8nt-opus46/index.html",
  off361:     "https://cua-traj-official.vercel.app/official361/index.html",
  proxy49:    "https://cua-traj-official.vercel.app/proxy49/index.html",
  v3full:     "https://cua-traj-early.vercel.app/v3full/index.html",
  v3pilot:    "https://cua-traj-early.vercel.app/v3pilot/index.html",
  gen100:     "https://cua-traj-early.vercel.app/gen100/index.html",
  transformed1:"https://cua-traj-early.vercel.app/transformed1/index.html",
  transformed2:"https://cua-traj-early.vercel.app/transformed2/index.html",
};
const P = {good:s=>`<span class="pill good">${s}</span>`, bad:s=>`<span class="pill bad">${s}</span>`,
           warn:s=>`<span class="pill warn">${s}</span>`, dim:s=>`<span class="pill dim">${s}</span>`};
const card = c=>`<div class="card"><div class="k">${c[0]}</div><div class="l">${c[1]}</div></div>`;
const tbl = (heads,rows)=>`<div class="tablewrap"><table><tr>${heads.map(h=>`<th ${h[1]||""}>${h[0]}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r}</tr>`).join("")}</table></div>`;
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- SFT: the tier-3 panel, live from sft.json ------------------------- */
const sftArms  = ()=> (window.SFT && window.SFT.arms)  || [];
const sftPanel = ()=> (window.SFT && window.SFT.panel) || [];
/* The teacher is excluded from every "best" figure on purpose: its 9/9 is the
   definition of the panel, not a result, and letting it win a headline would
   make the ceiling look like an achievement. */
const sftBest  = ()=> sftArms().filter(a=>a.group!=="teacher")
                               .reduce((m,a)=>Math.max(m,a.passed),0);
/* two slug segments name a task ("gdpr-art17"), except when the second is a
   connector and the pair says nothing ("vscode-no"), so take three. */
const shortSlug = s=>{ const p = String(s).split("-");
  const n = /^(no|to|of|from|for|and|in|on|at)$/.test(p[1]||"") ? 3 : 2;
  return p.slice(0,n).join("-"); };
/* one row per arm, one column per held-out task; every cell is a link into
   that arm's own step player for that task. */
function sftMatrix(){
  const P = sftPanel(), A = sftArms();
  if (!A.length) return `<p class="note">waiting for the first sft.json push…</p>`;
  const heads = [["arm"],["solved",'class="num"'],
    ...P.map(t=>[`${shortSlug(t.slug)}<small>d${t.diff} · ${t.dom.replace("libreoffice_","")}</small>`,
                 `class="task" title="${esc(t.slug)} — ${esc(t.instr)}"`])];
  const rows = A.map(a=>{
    const cells = P.map(t=>{
      const r = a.tasks[t.id];
      if (!r) return `<td class="cell"><span class="cnone">—</span></td>`;
      const cls  = r.score===1 ? "cpass" : "cfail";
      const mark = r.score===1 ? "✓" : "·";
      const tip  = `${a.label} · ${t.slug}: ${r.score===1?"pass":"fail"}, ${r.steps} steps, `
                 + `${r.distinct} distinct actions, longest repeat ${r.maxrep}`
                 + `${r.term?", emitted terminate":", never terminated"}`;
      const body = `${mark}<small>${r.steps}</small>`;
      return a.traj
        ? `<td class="cell"><a class="${cls}" title="${esc(tip)}" target="_blank" rel="noopener"
             href="traj/sft/${a.key}/${r.dom}/${t.id}/viewer.html">${body}</a></td>`
        : `<td class="cell"><span class="${cls}" title="${esc(tip)}">${body}</span></td>`;
    }).join("");
    /* untrained arms have no recipe to describe; an em-dash row is just noise */
    const sub = a.data === "—" ? "" :
      `<div class="why">${esc(a.data)} · ${esc(a.samples)} samples · ${esc(a.epochs)} ep `
      + `· preserve ${esc(a.preserve)}</div>`;
    return `<td><b>${esc(a.label)}</b>${sub}</td>`
         + `<td class="num hl">${a.passed}/${a.scored}</td>` + cells;
  });
  return tbl(heads, rows);
}
function sftArmTable(){
  const A = sftArms();
  if (!A.length) return `<p class="note">waiting for the first sft.json push…</p>`;
  return tbl([["arm"],["isolates"],["solved",'class="num"'],["terminated",'class="num"'],
              ["hit the 50-step cap",'class="num"'],["steps"]],
    A.map(a=>`<td><b>${esc(a.label)}</b><div class="why">${esc(a.group)}</div></td>`
      + `<td class="why">${esc(a.note)}</td>`
      + `<td class="num hl">${a.passed}/${a.scored}</td>`
      + `<td class="num">${a.term}/${a.scored}</td>`
      + `<td class="num">${a.capped}/${a.scored}</td>`
      + `<td class="num why">${Object.values(a.tasks).reduce((s,t)=>s+t.steps,0)}</td>`));
}

const VIEWS = [
{id:"runs", group:"Current", title:"All rollout runs", rate:"live",
 head:{t:"Every rollout run, one row each", pills:[P.good("auto-discovered"),P.dim("zero-config")],
   lede:"One row per result directory under results_generated/ — discovered from each run's own args.json by the dashboard daemon, no per-run wiring. Every row gets a trajectory column: a step player when published, 没跑 until then. Config columns come from the run's args.json / MODEL_BOUNDARY.json."},
 design:()=>{ const R=(window.LIVE&&window.LIVE.runs)||[]; if(!R.length) return `<p class="note">status.json has no runs yet — daemon warming up.</p>`;
  const rows=R.map(r=>`<tr><td>${r.model}</td><td>${r.batch}</td>`
    +`<td class="num">${r.scored}${r.total?"/"+r.total:""}</td>`
    +`<td class="num">${r.passed}</td>`
    +`<td class="num">${r.mean==null?"—":r.mean.toFixed(3)}</td>`
    +`<td class="num">${r.max_steps??"—"}</td>`
    +`<td class="num">${r.temperature??"—"}</td>`
    +`<td class="num">${r.sleep??"—"}</td>`
    +`<td class="num">${r.history_n??"—"}</td>`
    +`<td>${r.traj_published?`<a href="${r.traj}" target="_blank" rel="noopener">trajectory ↗</a>`:`<span class="dim">没跑</span>`}</td></tr>`).join("");
  return `<div class="seclabel">Runs${window.LIVE?` · as of ${window.LIVE.updated}`:""}</div>
  <div style="overflow-x:auto"><table><thead><tr><th>model</th><th>batch</th><th>scored</th><th>1.0</th><th>mean</th><th>steps</th><th>temp</th><th>sleep</th><th>hist</th><th>trajectory</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Rule (DASHBOARD.md): every run this page mentions must appear here with a trajectory cell — a viewer link once the daemon has published it, 没跑 before that. Viewers auto-publish for any run with ≥10 results and activity in the last 3 days.</p>`;}},
{id:"all", group:"Results", title:"All Results", rate:"", design:overviewDesign, traj:null},
{id:"v11-500", group:"Current", title:"v11-500 Rollout", rate:"live",
 head:{t:"v11-500 Rollout", pills:[P.good("live"),P.dim("ms50 · think, no preserve")],
   lede:"The same v11 pipeline, scaled: 444 tasks drawn from the same 1300-cell taxonomy with every v11 fix already in force. Numbers below refresh from the lab machine every few minutes."},
 design:()=>{ const s = window.LIVE && window.LIVE.v11_500; const r = s && s.scored; return `
  <div class="seclabel">Results so far${s?` · as of ${window.LIVE.updated}`:""}</div>
  <div class="cards">${(r
     ? [[Math.round(100*s.passed/s.scored)+"%", "pass ("+s.passed+"/"+s.scored+" scored, of "+s.corpus+")"],
        ...Object.entries(s.domains||{}).sort((a,b)=>b[1][1]-a[1][1]).map(([d,v])=>[v[0]+"/"+v[1], d])]
     : [["—","rollout starting"],[s?s.corpus:"444","tasks ready"]]).map(card).join("")}</div>
  <div class="seclabel">Conditions</div>
  <dl class="conds">${conds({corpus:"v11-500 · 444 tasks", generator:"claude-opus-5", "max steps":"100 + WAIT breaker (10)",
      thinking:"on · not preserved", "temp / top-p":"0.6 / 0.95", sleep:"1 s", envs:"3 docker VMs",
      screen:"1920×1080", solver:"Qwen3.6-27B · BF16 → FP8", "result dir":"v11-500-ms100-think-nopreserve"})}</dl>
  <div class="seclabel">Precision boundary — this campaign is deliberately mixed</div>
  ${tbl([["segment"],["solver"],["tasks",'class="num"'],["passed",'class="num"']],[
   `<td>up to 2026-08-14 07:55 UTC</td><td>Qwen3.6-27B <b>BF16</b></td><td class="num">121</td><td class="num">32</td>`,
   `<td>after</td><td>Qwen3.6-27B-<b>FP8</b> (official quantization)</td><td class="num">the rest</td><td class="num">—</td>`])}
  <p class="note">Switched mid-campaign after a measured A/B on identical prompts and images:
  <b>1.41× at 1 image, 1.51× at 8, 1.39× at 20</b>. The served model name is unchanged
  (<code>qwen36-27b-bf16-local</code>) so paths and comparisons stay put — which makes the directory
  name a misnomer, so <b>the precision of record is <code>PRECISION_BOUNDARY.json</code> in the
  result dir</b>, listing every BF16 task by id. Any per-task analysis that cares must read it
  rather than assume the corpus is homogeneous.</p>
  <div class="seclabel">How the corpus is designed</div>
  ${tbl([["axis"],["design"]],[
   "<td><b>coordinate draw</b></td><td>intent (5) × domain (13) × difficulty (5) × ambiguity (4); <b>444 tasks in 444 distinct cells</b>, quota charged on keep</td>",
   "<td><b>difficulty</b></td><td>monotone ladder, d3+ crosses an application boundary → 60% cross-app (single 177 · two 206 · three 61)</td>",
   "<td><b>ambiguity</b></td><td>43 explicit · 130 functional · 137 deictic · 134 outcome-only</td>",
   "<td><b>warm start</b></td><td>68% open their workspace in config, near the official family's rate</td>",
   "<td><b>voice</b></td><td>contextful 186 · terse 125 · polite 101 · sloppy 32</td>",
   "<td><b>R + P</b></td><td>fixable gate failures get one ~200-token instruction rewrite then re-gate (setup/probe untouched)</td>"])}
  <div class="seclabel">Pre-run verification — what each layer caught</div>
  ${tbl([["layer"],["scope"],["caught / removed"]],[
   "<td><b>0 · prebuild</b></td><td>160 soffice setups</td><td>all rewritten to host-built base64 fixtures — the compositor bug that cost v11 its calc domain cannot occur here</td>",
   "<td><b>1 · sanitise + gates</b></td><td>472 specs</td><td>5 leaked <code>&lt;/setup&gt;</code> tags (a shell syntax error that builds nothing), 2 browser free-passes, 1 unbuildable fixture</td>",
   "<td><b>2 · similarity</b></td><td>whole corpus</td><td>17 near-duplicates over two iterative rounds</td>",
   "<td><b>3 · defect scan</b></td><td>7 classes, severity-aware</td><td>2 instructions repaired (probe pinned a name the agent was never told), 1 media fixture blocked</td>",
   "<td><b>4 · VM controls</b></td><td>444 tasks, fresh VM each</td><td><b>0 failures</b> — every task builds its start state, shows its workspace, and scores 0 when idle</td>"])}
  <div class="seclabel">Similarity &amp; contamination</div>
  ${tbl([["test"],["worst",'class="num"'],["gate",'class="num"']],[
   `<td>internal jaccard</td><td class="num">0.38</td><td class="num">&lt; 0.40</td>`,
   `<td>internal tf-idf cosine</td><td class="num">0.49</td><td class="num">&lt; 0.50</td>`,
   `<td>vs CUA-Gym (10,909 refs)</td><td class="num">0.47</td><td class="num">&lt; 0.50</td>`,
   `<td>vs official OSWorld-361</td><td class="num">0.46</td><td class="num">&lt; 0.50</td>`,
   `<td>quota drift</td><td class="num">2%</td><td class="num">≤ 2%</td>`])}
  <div class="seclabel">Domain mix</div>
  <p class="note" style="margin-top:0">vs_code 112 · calc 70 · os 63 · impress 55 · chrome 47 · writer 35 · thunderbird 29 · gimp 23 · vlc 10 &nbsp;·&nbsp; grading: probe 371 · table 61 · browser 12</p>`},
 traj:{url:"traj/v11-500/index.html", n:"every scored task, refreshed with the run",
       note:"Step player per task: the model's verbatim thinking, tool calls, executed pyautogui and the VM screenshot at each step."}},
{id:"q38", group:"Current", title:"Qwen3.8 · both corpora", rate:"live",

/* ---------------------------- SFT ------------------------------------- */
{id:"sft", group:"SFT", title:"Overview", rate:"",
 head:{t:"SFT — teacher to student", pills:[P.warn("SFT still below the stock model"),P.dim("Qwen3.6-27B → Qwen3.5-4B")],
   lede:"Successful teacher rollouts on the generated tasks become training data for Qwen3.5-4B. This half of the project has produced one solid negative result and one lever that works — both measured by driving real VMs, because nothing else could see them."},
 design:()=>{ const A=sftArms(), best=sftBest(), base=A.find(a=>a.key==="qwen35-4b-base"); return `
  <div class="seclabel">The loop${window.SFT?` · live as of ${window.SFT.updated}`:""}</div>
  <div class="flow">
    <span class="n">generated tasks</span><span class="a">→</span>
    <span class="n">teacher rollout</span><span class="a">→</span>
    <span class="n">passing trajectories only</span><span class="a">→</span>
    <span class="n">step samples (context = the agent's own message builder)</span><span class="a">→</span>
    <span class="n">Qwen3.5-4B SFT</span><span class="a">→</span>
    <span class="n">9 held-out tasks in real VMs</span></div>
  <div class="seclabel">Headline — every proxy metric improved and the model got worse at the job</div>
  <div class="cards">${[
    [(base?base.passed:4)+"/9 → 1/9", "stock Qwen3.5-4B vs the same model after 1 epoch of SFT. Teacher: 9/9 by construction"],
    ["0.528 → 0.273", "held-out eval loss over the same run — monotone improvement, start to finish"],
    ["0.775 → 0.800", "best action-type accuracy of any model on the teacher-forced exam (now archived)"],
    ["0.61%", "share of training tokens that strictly require looking at the screen"],
    [best+"/9", "best any trained arm has reached so far"]].map(card).join("")}</div>
  <p class="note">This is the section's real finding, and it is a methods finding:
  <b>loss curves and teacher-forced exams cannot detect a policy that has stopped reading its
  observation</b>, because teacher forcing hands it a correct history no matter what it does.
  Only driving the actual VM exposed it. The action exam was archived for exactly this reason —
  it ranked the checkpoint that solved 1 of 9 real tasks as the best model on its panel.</p>
  <div class="seclabel">Epochs are the one lever that has moved the real metric</div>
  ${tbl([["e1 → e3, same 916 samples, same recipe"],["e1 · 1 epoch",'class="num"'],["e3 · 3 epochs",'class="num"']],[
   `<td>tasks solved</td><td class="num">1 / 9</td><td class="num hl">3 / 9</td>`,
   `<td>tasks that emitted <code>terminate</code></td><td class="num">0 / 9</td><td class="num hl">4 / 9</td>`,
   `<td>tasks that burned the full 50 steps</td><td class="num">9 / 9</td><td class="num">5 / 9</td>`,
   `<td>mean steps per task</td><td class="num">50</td><td class="num">33</td>`,
   `<td><code>mouse_move</code> share of actions</td><td class="num">32%</td><td class="num">15%</td>`])}
  <p class="note"><b>But epochs are not simply "more is better", and the arm that tested it went to
  zero.</b> <code>more3</code> — 1288 samples, 3 epochs, fully annealed — scored <b>0/9</b>, the
  lowest of any arm, while fitting the data <i>better</i> than e3 (final train loss 0.0335 vs
  0.0373, token accuracy 0.9906 vs 0.9861). It also takes <b>40% more optimizer steps</b> than e3
  (483 vs 345), because at a fixed batch the sample count sets steps per epoch — so that comparison
  moves data volume and optimization together and cannot attribute the loss to either. Both runs sit
  past the overfitting knee (<code>eval_loss</code> rises through training in both). The checkpoint
  that separates the two causes is already on disk.</p>
    <p class="note"><b>e1 never emitted <code>terminate</code> once in 450 actions</b> — including on
  the task it passed, where it kept oscillating between the address bar and the result link for 46
  steps after finishing. e3 emits <code>DONE</code> at step 5 on the same task. One epoch is enough
  to learn the output <i>format</i> (99.4% of the target tokens); it is not enough to learn the
  task's <i>temporal structure</i>, which lives in rare tokens — <code>terminate</code> is 3.6% of
  target actions, <code>wait</code> 3.4%. That also explains why eval loss saw nothing: it is
  dominated by the 99.4%, so it "converged" around step 20 while the behaviour that decides success
  was still being learned. <b>Terminate rate is now a first-class metric here — it moved when loss
  did not.</b></p>
  <div class="seclabel">Termination tracks success across every arm</div>
  ${tbl([["arm"],["terminated",'class="num"'],["solved",'class="num"'],["hit the 50-step cap",'class="num"']],[
   `<td><b>stock Qwen3.5-4B</b></td><td class="num">7/9</td><td class="num hl">4/9</td><td class="num">2/9</td>`,
   `<td><b>e3</b> · 916 · 3 ep</td><td class="num">4/9</td><td class="num hl">3/9</td><td class="num">5/9</td>`,
   `<td>e1 · 916 · 1 ep</td><td class="num">0/9</td><td class="num">1/9</td><td class="num">9/9</td>`,
   `<td>more · 1288 · 1 ep</td><td class="num">2/9</td><td class="num">1/9</td><td class="num">6/9</td>`,
   `<td>more3np · 1288 · 3 ep · preserve off</td><td class="num">4/9</td><td class="num">1/9</td><td class="num">5/9</td>`,
   `<td>more3 · 1288 · 3 ep · preserve on</td><td class="num">3/9</td><td class="num">0/9</td><td class="num">6/9</td>`])}
  <p class="note">Not monotone, but unmistakable in direction: <b>a model that cannot stop cannot
  finish.</b> <code>terminate</code> is 3.6% of target actions and invisible to every token-level
  metric here — which is why loss and accuracy improved while this collapsed. <b>No SFT arm has
  reached the stock model.</b></p>
  <p class="note">The sharpest single frame is on <code>arxiv-listing</code>, the easiest task on the
  panel. e3 finishes in five steps and terminates. <code>more3</code> alternates
  <code>click(215,280)</code> and <code>typewrite("1207.7214")</code> for all fifty —
  <b>two distinct actions, one of them 27 times</b> — and the screen changes on 28 of 49 transitions,
  because the clicks open and close something and the state cycles. Both trajectories are watchable
  side by side in the Tier-3 Panel.</p>
    <div class="seclabel">Why the screenshot stopped mattering — measured, not guessed</div>
  ${tbl([["share of a training target (mean 587 chars)"],["portion",'class="num"'],["needs the pixels?"]],[
   `<td><code>&lt;think&gt;</code> reasoning prose</td><td class="num">59%</td><td class="why">no — continues the previous turn</td>`,
   `<td>action names + tool-call boilerplate</td><td class="num">~35%</td><td class="why">no — format and task priors</td>`,
   `<td>coordinate tags (XML wrapper)</td><td class="num">4.9%</td><td class="why">wrapper no</td>`,
   `<td><b>coordinate digits</b></td><td class="num hl">0.61%</td><td class="why"><b>yes — only these</b></td>`])}
  <p class="note">Cross-entropy is averaged over tokens, so across ~115 optimizer steps the cheapest
  way down is to model the 99.4% that text context already predicts. Grounding is both the hardest
  skill and the smallest share of the reward.</p>
  <div class="seclabel">Ruled out, with the evidence that ruled it out</div>
  ${tbl([["hypothesis"],["verdict"],["evidence"]],[
   `<td><b>damaged vision</b></td><td class="hl">no</td><td class="why"><code>freeze_vit</code>, <code>freeze_aligner</code> and <code>freeze_parameters=['model.visual','model.visual.merger']</code> all on — the vision tower never moved</td>`,
   `<td><b>image budget</b></td><td class="hl">no</td><td class="why">1920×1088 → 60×34 = 2040 visual tokens; the <code>IMAGE_MAX_TOKEN_NUM=2048</code> cap never clipped. And the stock arm ran the identical pipeline for 4/9 — a constant cannot explain a difference</td>`,
   `<td><b>repeated-action training data</b></td><td class="hl">no</td><td class="why">of 873 samples with a previous assistant turn, 15 (1.7%) repeat the previous target — the loop filters worked</td>`,
   `<td><b>image/response misalignment</b></td><td class="hl">no</td><td class="why">the runner writes each screenshot after <code>env.step()</code>, so a sample's last image is exactly the screen its target acts on</td>`,
   `<td><b>sampling</b></td><td class="hl">no</td><td class="why">top_k 20 (Qwen3.5's official setting) left the stock model at 4/9; presence_penalty 1.5 moved an SFT arm 1→2 without touching the loop rate (7/9 either way)</td>`,
   `<td><b><code>preserve_thinking</code></b></td><td class="hl">no</td><td class="why">both variants landed on exactly 1/9 — identical damage with and without history reasoning in the training context</td>`,
   `<td><b>data integrity</b></td><td class="hl">fixed</td><td class="why">a third of the corpus had silently never loaded (below); every arm since is preflighted</td>`,
   `<td><b>data volume</b></td><td class="warn">open</td><td class="why">only a 2× span has been tested (609 → 1288), all of it below the 412-trajectory / 3,085-sample outside reference. Not a settled question</td>`])}
  <div class="seclabel">The defect that cost a day — and the rule that replaced it</div>
  ${tbl([["stage"],["what happened"]],[
   `<td><b>symptom</b></td><td>four pilot arms trained and evaluated normally; every cheap check passed — files present, row counts matched, md5s matched, the trainer printed <code>train_dataset: 916 rows</code></td>`,
   `<td><b>reality</b></td><td>two dataset files carried <i>relative</i> image paths and the job ran from a different working directory. ms-swift falls back to base64-decoding an unresolvable path, throws <code>UnidentifiedImageError</code>, drops the sample with one warning line and substitutes a random other one. <b>307 of 916 samples (33%) could never load</b></td>`,
   `<td><b>fix</b></td><td>datasets emit absolute media paths; jobs never <code>cd</code> into a data directory; a preflight opens every referenced file and exits non-zero before any GPU time; every run's log is grepped for the silent-skip warning afterwards</td>`,
   `<td><b>proof</b></td><td>the first arm under the new recipe logged <b>zero</b> <code>template.encode</code> errors, against 70 and 130 for the two arms it replaced</td>`])}
  <div class="seclabel">Loop filters: audited, three fixes proposed, all three reverted</div>
  <p class="note">Three filters run over every passing teacher trajectory before it becomes
  training data. Re-applied to all <b>71</b> passing trajectories they trim <b>614 tail steps</b>
  from 12 trajectories and drop <b>54 mid-episode targets</b>, and three trajectories escape them.
  Fixes were written for all three escapes. <b>None shipped</b> — verification killed them, and the
  two ways they died are more useful than the fixes would have been.</p>
  ${tbl([["proposal"],["killed by"],["what it would have destroyed"]],[
   `<td><b>collapse a caught run in the rendered history</b></td><td class="hl">reading the labels</td><td class="why">the 7 samples it removed are a <b>recovery demonstration</b> — after 55 identical clicks the labels are "click somewhere else", "redo what worked", <code>terminate</code>. This corpus never otherwise demonstrates getting unstuck, because every trajectory is a teacher success. The repetitive context is not poison, it is the setup that gives the recovery label meaning</td>`,
   `<td><b>lower the repeat threshold 8 → 7</b></td><td class="hl">hashing the screenshots</td><td class="why">its only case scrolls a spreadsheet 7× — and <b>the screen changed at every one of those steps</b>. That is paging down, not grinding. It would have deleted 6 correct targets</td>`,
   `<td><b>a mid-episode oscillation filter</b></td><td class="hl">the same check</td><td class="why">built on repeat count like the one above; would have taken a 7th target from that same productive scroll</td>`])}
  <p class="note"><b>The rule that came out of it:</b> a repeated action is pathological only if the
  world did not respond — <code>action(k+1) == action(k)</code> <i>and</i>
  <code>screenshot(k) == screenshot(k-1)</code>. Count says nothing. Measured across 73
  trajectories that criterion would drop <b>8 targets (0.49%)</b> and correctly spares the
  productive scroll. At 0.49% it is not worth a recipe change; it is recorded as the shape any
  future loop filter must take instead of a threshold.</p>
  <p class="note">Kept from the whole episode: one counter. <code>recovery_samples</code> —
  <b>100 corpus-wide</b> — so the next proposal to filter them has a number to argue with.</p>
  <div class="seclabel">Discipline that made the catch possible</div>
  ${tbl([["rule"],["what it does"]],[
   `<td>samples via the agent's own code</td><td class="why">context assembled by the rollout agent's message builder — format parity by construction, labels are the verbatim teacher response</td>`,
   `<td>judge-then-mechanize filtering</td><td class="why">an LLM judge found 4 loop patterns; they were mechanized as calibrated filters (29.5% of steps cut, zero false positives on a 51-trajectory calibration)</td>`,
   `<td>frozen recipes + a run ledger</td><td class="why">every run appends a row — job id, recipe version, data snapshot, outcome including failures; changes only ever land as versioned recipe blocks</td>`,
   `<td>snapshot isolation</td><td class="why">every training run reads its own frozen hardlink snapshot; a live data directory is never touched by a running job</td>`,
   `<td>same-exam rule</td><td class="why">a baseline is only valid for deltas if it took the identical exam; a panel or parser change means everyone retakes</td>`])}`},
 traj:null},

{id:"sft-panel", group:"SFT", title:"Tier-3 Panel", rate:"live",
 head:{t:"Tier-3 — the student drives the VM itself", pills:[P.good("live"),P.warn("recipe ranking, not a model score"),P.dim("9 held-out tasks · ms50 · 3 VMs")],
   lede:"An instrument for choosing a training recipe, not a measure of the model. Nine tasks held out of the training corpus, run end to end in real VMs and scored by each task's own checker. Every cell in the matrix opens that arm's step player for that task."},
 design:()=>{ const A=sftArms(), S=window.SFT; return `
  <div class="seclabel">Every arm on the same nine tasks${S?` · as of ${S.updated}`:""}${
    S&&S.panel_id?` · panel <code>${S.panel_n}/${S.panel_id}</code>`:""}</div>
  ${sftArmTable()}
  <div class="seclabel">Task × arm — click any cell to watch that run</div>
  ${sftMatrix()}
  <p class="note">Cell = pass (✓) or fail (·) with the number of steps it took; the tooltip carries
  distinct-action count, longest repeated action and whether the run ever emitted
  <code>terminate</code>. A cell is a link once that arm's trajectories have been published;
  publishing happens once per arm, because an arm freezes the moment its ninth result lands.</p>
  <div class="seclabel">Reading the teacher row</div>
  <p class="note">The top row is <b>not a rollout</b>. It is Qwen3.6-27B's own passing trajectories,
  lifted out of the runs that produced the SFT data — 7 from the v11 run (50-step budget), 2 from
  v11-500 (100-step budget), provenance per task in <code>PROVENANCE.json</code>. Its 9/9 is
  <b>selection, not a score</b>: these tasks are the validation split of a dataset built only from
  trajectories that scored 1.0, so the teacher passing all nine is a tautology. It is on the table
  because it is the demonstration the student was trained on — worth watching, not worth ranking.</p>
  <p class="note">Watching it is also humbling in a useful way. <b>The teacher terminates on 7 of 9 —
  exactly the stock 4B's rate</b> — and its trajectory for <code>vscode-no-telemetry</code> burns all
  50 steps with 7 distinct actions and <b>one action repeated 44 times</b>, passing only because the
  checker reads the final state. <code>chrome-downloads</code> repeats 10× and never terminates.
  Some of what SFT is being asked to imitate is itself loop-locked; that is what the tail filters
  exist to strip, and it is an argument for scoring teacher trajectories on more than the final
  checker verdict before they become training data.</p>
  <div class="seclabel">What this panel is for — and what it cannot tell you</div>
  <p class="note">These nine tasks are <b>in-distribution by construction</b>: same generator, same
  1300-cell taxonomy, and they are literally the validation split of the training corpus. That makes
  them a cheap, sharp instrument for <b>ranking recipes</b> — ~1 h per arm, and it is what found the
  epoch lever when loss saw nothing. It does <b>not</b> make them a measure of whether the model got
  better at desktop work.</p>
  <p class="note"><b>Real evaluation moves to benchmarks the line has never trained toward</b>,
  OSWorld-Verified first. That is valid precisely because contamination was gated up front: the
  generated corpus scores max cosine <b>0.46 against official-361</b> under a &lt; 0.50 gate, so the
  student has never seen a paraphrase of it. The blocking prerequisite is a baseline that does not
  exist yet — <b>there is no stock Qwen3.5-4B number on OSWorld-Verified</b>; only the teacher has
  one (45.2%, 141/312 non-proxy). Without it, "SFT helped" and "a 4B is simply weak here" are the
  same number. Measured cost at the current rate (13 tasks/h on 3 VMs): <b>~24 h per arm</b> for the
  312 non-proxy tasks.</p>
  <div class="seclabel">Where these nine tasks come from — nobody picked them</div>
  ${tbl([["property"],["detail"]],[
   `<td><b>the split</b></td><td><code>int(md5(slug),16) % 1000 &lt; val_ratio*1000</code> in the dataset builder — the same task-level split that produces the validation set</td>`,
   `<td><b>task-level, not sample-level</b></td><td>one trajectory yields many step samples sharing a long context prefix; splitting by sample would put a held-out sample's own prefix into training. Splitting by slug keeps every step and every frame of a task on one side</td>`,
   `<td><b>deterministic</b></td><td>a hash of the slug string — <b>no seed, no RNG, nothing to set</b>. A task that is validation in one build is validation in every later build; rebuilding from 17 → 29 passing trajectories moved nothing across the line</td>`,
   `<td><b>one escape hatch</b></td><td>if the draw selects nobody, the builder forces the lexicographically-first passing slug into validation so the split is never empty. On a small corpus that makes the val set depend on <i>which tasks passed</i> — i.e. on the rollout. It has not fired for these corpora, but it is the one path by which a rebuild could move the panel</td>`,
   `<td><b>frozen, not drawn</b></td><td>the panel the arms actually run is a materialised directory (<code>eval_valpanel_tasks/</code>), not a live draw. The header above prints <code>count/fingerprint</code> so a silent regeneration shows up: <b>an arm measured on 9 tasks is not comparable to one measured on 12</b></td>`,
   `<td><b>composition</b></td><td>the union of both corpora's val tasks: 7 from v11-legacy, 2 from v11-500</td>`,
   `<td><b>teacher 9/9</b></td><td>by construction — SFT data is built only from <code>score == 1.0</code> trajectories, so every val task is one the teacher solved. That is the ceiling line, not an achievement</td>`])}
  <div class="seclabel">Contamination check (run 2026-08-14)</div>
  ${tbl([["dataset"],["train rows",'class="num"'],["exam slugs in train",'class="num"'],["exam slugs in val",'class="num"']],[
   `<td>abs-pilot2</td><td class="num">916</td><td class="num hl">0 / 9</td><td class="num">9 / 9</td>`,
   `<td>abs-pilot3</td><td class="num">1288</td><td class="num hl">0 / 9</td><td class="num">9 / 9</td>`])}
  <p class="note">Not "the task was seen but not its answer" — the entire task, all of its steps and
  frames, never entered training.</p>
  <div class="seclabel">Conditions (identical for every arm)</div>
  <dl class="conds">${conds({panel:"9 held-out tasks","max steps":"50", "temp / top-p":"0.6 / 0.95",
    sampler:"top_k 20 where noted", envs:"3 docker VMs — one arm at a time", screen:"1920×1080",
    serving:"vLLM, each checkpoint's own chat template", scoring:"the task's own evaluator, pass = 1.0"})}</dl>
  <p class="note">One arm at a time is a hard constraint, not a preference: three VMs is the
  machine's memory ceiling, so drivers chain on each other's completion markers rather than
  contending. Checkpoints are streamed into eval as they land — a training run's epoch-boundary
  checkpoint starts its 9 tasks while the next epoch is still training.</p>`},
 traj:{picker:true, n:"9 tasks per arm · every step the model took",
   note:"Same step player as the rollouts: verbatim thinking, tool call, the pyautogui that ran, and the VM screenshot at each step."}},

{id:"sft-train", group:"SFT", title:"Training runs", rate:"",
 head:{t:"Training runs", pills:[P.dim("full-parameter · 1 GPU · ms-swift")],
   lede:"What has been trained, on what, and what each arm is there to isolate. Arms with a tier-3 result are in the panel view; this page is the recipe and the schedule caveats that make those numbers readable."},
 design:()=>`
  <div class="seclabel">Runs in flight</div>
  ${tbl([["job"],["arm"],["data"],["epochs",'class="num"'],["preserve_thinking"],["annealed?"],["what it answers"]],[
   `<td class="num">229277</td><td><b>ep5pt</b></td><td>abs-pilot3 · 1288</td><td class="num">5</td><td class="hl">true</td><td>snapshots</td><td class="why">the epoch curve with history reasoning kept</td>`,
   `<td class="num">229278</td><td><b>ep5np</b></td><td>abs-pilot3 · 1288</td><td class="num">5</td><td>false</td><td>snapshots</td><td class="why">the same curve without it</td>`,
   `<td class="num">229348</td><td><b>more3</b></td><td>abs-pilot3 · 1288</td><td class="num">3</td><td class="hl">true</td><td class="hl">yes</td><td class="why">vs e3 (916, 3 ep): does volume help once epochs are sufficient?</td>`,
   `<td class="num">229354</td><td><b>more3np</b></td><td>abs-pilot3 · 1288</td><td class="num">3</td><td>false</td><td class="hl">yes</td><td class="why">the flag's effect at one properly annealed point</td>`])}
  <p class="note">Each pair answers a different question. <b>ep5pt vs ep5np</b> gives the flag's
  effect along a whole 5-epoch curve; <b>more3 vs more3np</b> gives it at a single annealed point.
  <b>more3 vs e3</b> isolates data volume now that epochs are sufficient — the 1-epoch version of
  that comparison (more vs e1) showed nothing, but that was before the model had learned to
  terminate at all.</p>
  <div class="seclabel">An epoch-k checkpoint is not a k-epoch model</div>
  ${tbl([["run"],["total steps",'class="num"'],["LR at the end of epoch 3",'class="num"']],[
   `<td>e3 — a 3-epoch run</td><td class="num">345</td><td class="num hl">0.0 — annealed (1e-8 at step 340, 0.0 by 342)</td>`,
   `<td>ep5pt / ep5np — 5-epoch runs</td><td class="num">805</td><td class="num">3.77e-6 = 38% of peak, still moving</td>`])}
  <p class="note">The cosine schedule spans the run's <b>total</b> steps, so "epoch 3" means
  different things in different runs. e3's final checkpoint is a finished product; a 5-epoch run's
  epoch-3 snapshot is mid-flight. Expect the snapshot to look worse and do <b>not</b> read that as a
  contradiction — it is the schedule. The five checkpoints of one run are comparable to each other
  (one schedule, five points along it); they are not answers to "what would a k-epoch run produce".
  Every checkpoint in the ledger carries the LR it was saved at.</p>
  <div class="seclabel">Recipe v3 — what is frozen</div>
  ${tbl([["flag"],["value"],["why"]],[
   `<td><code>--tuner_type</code></td><td>full</td><td class="why">full-parameter on the 4B; swift 4.x renamed <code>--train_type</code></td>`,
   `<td><code>--loss_scale</code></td><td>last_round</td><td class="why">one sample per step, loss only on the final assistant turn</td>`,
   `<td><code>--preserve_thinking</code></td><td>true / false (the arm)</td><td class="why">swift strips history <code>&lt;think&gt;</code> by default, but the teacher generated every action <i>seeing</i> its own past reasoning — training was the only link that deleted it</td>`,
   `<td><code>IMAGE_MAX_TOKEN_NUM</code></td><td>2048</td><td class="why">screenshots are 1920×1088 ≈ 2040 visual tokens; the official example's 1024 would downsample training images relative to the rollout</td>`,
   `<td><code>--max_length</code></td><td>65536</td><td class="why">late-step samples carry up to 20 images ≈ 50k+ tokens</td>`,
   `<td>vision tower</td><td>frozen</td><td class="why"><code>freeze_vit</code> + <code>freeze_aligner</code> + explicit <code>freeze_parameters</code></td>`,
   `<td>preflight</td><td>mandatory</td><td class="why">opens every referenced media file from the job's own working directory and exits non-zero on any miss — the fix for the 33% silent drop</td>`])}
  <div class="seclabel">Why training is slow — measured, nothing applied yet</div>
  <p class="note">Baseline: <b>46.3 s per optimizer step</b>, 805 steps = <b>10.3 h</b> for a
  5-epoch run. One epoch is 35.3 M tokens over 161 steps — <b>4,740 tokens/s</b> on one H200.
  <b>84% of those tokens are screenshots</b> (11.2 images per sample × 2040 visual tokens = 22.8k
  of a 27.4k-token mean).</p>
  ${tbl([["what decides the fix"],["measured"]],[
   `<td>layers</td><td>32 = <b>24 linear-attention + 8 full-attention</b> — so FlashAttention only reaches a quarter of the model, contrary to the usual first instinct</td>`,
   `<td><b>vocabulary</b></td><td><b>248,320</b> — the logits tensor for one 27k-token sample is <b>13.4 GB in bf16</b>, more when cross-entropy upcasts, plus its gradient. Very likely why this config needs both CPU-offloaded Adam and gradient checkpointing</td>`,
   `<td>vision tower</td><td>frozen (<code>freeze_vit</code>/<code>freeze_aligner</code> default true) — forward cost only</td>`])}
  ${tbl([["lever"],["status"],["why"]],[
   `<td><b>1 · <code>--use_liger_kernel true</code></b></td><td class="hl">installed, flag exists, never passed</td><td class="why">fused linear+CE never materialises the 13.4 GB logits tensor. The prize is the memory headroom that unlocks 2 and 3</td>`,
   `<td><b>2 · drop the CPU offload</b></td><td>config</td><td class="why">the optimizer step currently runs on CPU every 8 micro-batches; 4B on GPU needs ~64 GB of 141, which should fit once 1 lands</td>`,
   `<td><b>3 · gradient checkpointing off</b></td><td>config</td><td class="why">a 30–40% recompute tax, affordable only after 1+2</td>`,
   `<td><b>4 · install <code>causal_conv1d</code></b></td><td class="hl">missing</td><td class="why">24 of 32 layers are linear attention and use a short causal conv; without it there is a slower fallback</td>`,
   `<td><b>5 · two GPUs</b></td><td>scheduling</td><td class="why">halves wall-clock. The original smoke ladder went 322 → 85 s/it on 1 → 2 GPUs — superlinear, consistent with the 1-GPU config thrashing on exactly the memory lever 1 targets</td>`,
   `<td>6 · <code>flash_attn</code></td><td>missing, 20-min build</td><td class="why">reaches only 8 of 32 layers here — lower priority than it looks</td>`,
   `<td>7 · packing / padding-free</td><td>flags exist, unused</td><td class="why">at batch size 1 there is no padding to save; the win is filling the 65k window. <b>Risky on a hybrid arch</b> — verify sequences cannot leak across packed boundaries before chasing speed</td>`,
   `<td><b>8 · shrink the image window</b></td><td>not a config change</td><td class="why">the 84%. It comes from the agent, so cutting it changes what the model sees at inference too — biggest lever, and the only one that also speeds up rollout, but an accuracy experiment rather than a free win</td>`])}
  <p class="note">Nothing has been applied: four runs are in flight and must not be disturbed. The
  test is the same smoke ladder that established this environment — a short job on a fixed subset,
  ~20 steps, one change at a time, minutes and well under $1 each.</p>
  <div class="seclabel">Scale, honestly stated</div>
  <p class="note">The trained arms span 609 → 1288 samples: a 2× range, all of it below the outside
  reference point this line is measured against (412 teacher trajectories / 3,085 turn-level
  samples). Data integrity has been eliminated as a cause of the regression; <b>data volume has
  not</b> — it has barely been varied. An external checkpoint trained on that larger corpus sits in
  the panel as an outside reading.</p>`,
 traj:null},

function conds(o){return Object.entries(o).map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}
function overviewDesign(){
  const rows = [
   ["v11 rollout","v11 · 100","ms50 · think, no preserve","100","39","39%","complete"],
   ["v11-500 corpus","v11-500 · 450","not rolled yet","—","—","—","controls running"],
   ["OSWorld-Verified 361","official · 361","ms50 · thinking inert · sleep 3","312","141","45%","proxy pending"],
   ["Proxy-49 direct","official subset · 49","ms50 · no proxy (deliberate)","45","5","11%","experiment"],
   ["v8big","v8 · 203","ms100 · think, preserve","99","24","24%","stopped · resumable"],
   ["v8nt · Opus 5 tasks","v8-style · 20","ms50 · thinking off","9","3","33%","stopped"],
   ["v8nt · Opus 4.6 tasks","v8-style · 23","ms50 · thinking off","8","4","50%","stopped"],
   ["v10","70 tasks","no VM — generation control group","—","—","—","control group"],
   ["v9","213 specs","no VM — superseded","—","—","—","superseded"],
   ["v3full","v3 · 74","ms100 · thinking off","74","26","35%","complete"],
   ["v3 pilot","v3 · 5","ms100 · thinking off","5","1","20%","smoke"],
   ["generated-trajectory-100","legacy · ~100","legacy protocol","191","115","60%","not comparable"],
   ["transformed-osworld","transformed · 19","batches 001/002","19","13","68%","dropped"],
   ["early smokes","assorted · 13","wiring checks","12","5","—","smoke"],
  ].map(r=>`<td><b>${r[0]}</b></td><td>${r[1]}</td><td class="why">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="num hl">${r[5]}</td><td class="why">${r[6]}</td>`);
  const s = lv();
  return `
  <div class="seclabel">Headline${s?` · live as of ${window.LIVE.updated}`:""}</div>
  <div class="cards">${[[s?s.rate+"%":"39%", s?`v11 complete — ${s.passed}/${s.scored} solved (vs 24% for v8, same solver)`:"v11 complete (vs 24% for v8)"],["45%","official anchor (312 scored)"],["4×","v11 generation yield vs v10"],["450","v11-500 tasks in verification"],["18","runs on record"]].map(card).join("")}</div>
  <div class="seclabel">Every run · conditions · results</div>
  ${tbl([["run"],["corpus"],["conditions"],["scored",'class="num"'],["passed",'class="num"'],["rate",'class="num"'],["status"]],rows)}
  <div class="seclabel">Instruction-shape yardstick</div>
  ${tbl([["metric"],["v8 (192)",'class="num"'],["v10 (70)",'class="num"'],["v11 (100)",'class="num"'],["official",'class="num"']],[
   `<td>words, median</td><td class="num">53</td><td class="num">29</td><td class="num hl">31</td><td class="num">26</td>`,
   `<td>≤ 25 words</td><td class="num">1%</td><td class="num">—</td><td class="num hl">34%</td><td class="num">~50%</td>`,
   `<td>absolute path in instruction</td><td class="num">87%</td><td class="num">—</td><td class="num hl">8%</td><td class="num">5%</td>`,
   `<td>internal cosine max (&lt;.5)</td><td class="num">0.45</td><td class="num">0.37</td><td class="num">0.49</td><td class="num">—</td>`,
   `<td>vs CUA-Gym 10,909 refs (&lt;.5)</td><td class="num">0.41</td><td class="num">0.43</td><td class="num">0.47</td><td class="num">—</td>`])}
  <div class="seclabel">Downstream — the tasks become SFT data${window.SFT?` · live as of ${window.SFT.updated}`:""}</div>
  <div class="cards">${[
    [sftBest()?sftBest()+"/9":"—", "best tier-3 result of any trained Qwen3.5-4B arm"],
    [(()=>{const b=sftArms().find(a=>a.key==="qwen35-4b-base"); return b?b.passed+"/9":"4/9";})(), "the stock 4B — the number SFT has to beat"],
    [sftArms().length||"—", "arms evaluated on the identical 9 held-out tasks"],
    ["0.61%", "share of training tokens that need the screenshot"]].map(card).join("")}</div>
  <p class="note">Successful teacher rollouts on these corpora train a Qwen3.5-4B student. So far
  SFT sits <b>below</b> the stock model on real tasks while every proxy metric improves — a
  methods finding, detailed under <a href="#sft" style="color:var(--accent-ink);font-weight:700">SFT →
  Overview</a>, with every arm's runs watchable in <a href="#sft-panel" style="color:var(--accent-ink);font-weight:700">Tier-3 Panel</a>.</p>
  <div class="seclabel">Findings that shaped the line</div>
  ${tbl([["finding"],["evidence"]],[
   `<td><b>length predicts failure</b></td><td>official 58%→16%, v8 33%→11% by instruction length; equal at matched lengths — the corpus gap was length mix</td>`,
   `<td><b>official pre-opens the workspace</b></td><td>85% Verified / 82% V2 / 47-of-47 impress → warm-start axis</td>`,
   `<td><b>thinking was silently off</b></td><td>DashScope-only flag + vLLM field rename; fixed from v8big on (99.7% capture)</td>`,
   `<td><b>repair beats reject</b></td><td>4× yield at equal gates, zero drift in graded fields</td>`,
   `<td><b>no in-VM presentation builds</b></td><td>txt→odp exists nowhere; decks ship as embedded prebuilt binaries</td>`,
   `<td><b>loop-lock ≠ (mainly) preserve</b></td><td>6/13 v11 fails loop under no-preserve ≈ v8's share — preliminary</td>`,
   `<td><b>Opus 5 writes tighter graders</b></td><td>~1.5× fewer coverage gaps than Opus 4.6, fixed judge</td>`])}`;
}
const groups = ["Results","Current","SFT","Baseline","v8 era","Corpus-only","Early"];
let curTab = "design";
function renderNav(sel){
  document.getElementById("nav").innerHTML =
   `<div class="brand">CUA · Task Generation<small>experiments &amp; rollouts dashboard</small></div>` +
   groups.map(g=>{
    const vs = VIEWS.filter(v=>v.group===g);
    return `<div class="gl">${g}</div>` + vs.map(v=>{
      let r = v.rate;
      if (v.id === "v11"){ const s = lv(); r = s ? s.rate + "%" : "live"; }
      if (v.id === "sft-panel" && sftArms().length){ r = sftBest() + "/9"; }
      if (v.id === "sft-train" && sftArms().length){ r = sftArms().length + " arms"; }
      return `<a href="#${v.id}" class="${v.id===sel?'sel':''}">${v.title}<span class="r ${r&&r!=="—"?'':'na'}">${r||""}</span></a>`;}).join("");
  }).join("");
}
function render(){
  const id = (location.hash||"#all").slice(1);
  const v = VIEWS.find(x=>x.id===id) || VIEWS[0];
  renderNav(v.id);
  let html = "";
  if (v.id==="all"){
    html = `<h1>Experiments on CUA Task Generation</h1>
      <p class="lede">LLM-generated desktop tasks → layered verification → Qwen3.6-27B rollouts → SFT trajectories. Solver identical everywhere; pass = evaluator score 1.0. Pick a run on the left: each has a <b>Design &amp; Audits</b> tab (how it was built, what was checked before it ran) and a <b>Trajectories</b> tab (the model actually running the tasks, step by step).</p>
      <div class="tabbody">${v.design()}</div>`;
  } else {
    const hasTraj = !!v.traj;
    html = `<h1>${v.head.t}<span class="pills">${v.head.pills.join("")}</span></h1>
      <p class="lede">${v.head.lede}</p>
      <div class="tabs">
        <button class="${curTab==='design'?'sel':''}" onclick="setTab('design')">Design &amp; Audits</button>
        ${hasTraj?`<button class="${curTab==='traj'?'sel':''}" onclick="setTab('traj')">Trajectories</button>`:""}
      </div>
      <div class="tabbody">${curTab==='design'||!hasTraj ? v.design() : trajBody(v.traj)}</div>`;
  }
  document.getElementById("content").innerHTML = html;
}
function trajBody(t){
  if (t.picker){          /* SFT: one published viewer per trained arm */
    const A = sftArms().filter(a=>a.traj);
    if (!A.length) return `<p class="note">No arm has published trajectories yet — publishing
      runs once per arm, after its ninth task is scored.</p>`;
    const opts = A.map(a=>`<option value="${a.traj}">${esc(a.label)} — ${a.passed}/${a.scored} solved</option>`).join("");
    return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select class="arm" id="armsel" onchange="pickArm(this.value)">${opts}</select>
      <a class="btn" id="trajopen" href="${A[0].traj}" target="_blank" rel="noopener">Open full-screen ↗</a>
      <span class="note" style="margin:0">${t.n}${t.note?" · "+t.note:""}</span></div>
    <iframe class="trajframe" id="trajf" src="${A[0].traj}" loading="lazy"></iframe>`;
  }
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <a class="btn" href="${t.url}" target="_blank" rel="noopener">Open full-screen ↗</a>
    ${t.url2?`<a class="btn ghost" href="${t.url2}" target="_blank" rel="noopener">${t.label2} ↗</a>`:""}
    <span class="note" style="margin:0">${t.n}${t.note?" · "+t.note:""}</span></div>
  <iframe class="trajframe" src="${t.url}" loading="lazy"></iframe>`;
}
function pickArm(u){
  document.getElementById("trajf").src = u;
  document.getElementById("trajopen").href = u;
}
function setTab(t){curTab=t; render();}
window.addEventListener("hashchange", ()=>{curTab="design"; render();});
render();
</script>
</body></html>
