<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiments on CUA Task Generation</title></head><body>

<style>
  :root{
    --bg:#f5f1e8; --surface:#fdfbf6; --ink:#20261f; --muted:#6b7263;
    --accent:#3d6b4f; --accent-ink:#2c5140; --line:#e2ddd0; --chip:#ece7da;
    --sel:#e3ead9; --good:#2e7d4f; --bad:#a83f45; --warn:#8f6a1f;
    --good-bg:#e4efe4; --bad-bg:#f6e8e8; --warn-bg:#f3ecd9; --code:#eae5d6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161a16; --surface:#1e241e; --ink:#e6e9e2; --muted:#9aa392;
      --accent:#7fb894; --accent-ink:#9ccbab; --line:#2e362d; --chip:#28302a;
      --sel:#26332a; --good:#6cc08b; --bad:#dd8287; --warn:#cfa458;
      --good-bg:#213228; --bad-bg:#342426; --warn-bg:#322b1c; --code:#272e26;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161a16; --surface:#1e241e; --ink:#e6e9e2; --muted:#9aa392;
    --accent:#7fb894; --accent-ink:#9ccbab; --line:#2e362d; --chip:#28302a;
    --sel:#26332a; --good:#6cc08b; --bad:#dd8287; --warn:#cfa458;
    --good-bg:#213228; --bad-bg:#342426; --warn-bg:#322b1c; --code:#272e26;
  }
  :root[data-theme="light"]{
    --bg:#f5f1e8; --surface:#fdfbf6; --ink:#20261f; --muted:#6b7263;
    --accent:#3d6b4f; --accent-ink:#2c5140; --line:#e2ddd0; --chip:#ece7da;
    --sel:#e3ead9; --good:#2e7d4f; --bad:#a83f45; --warn:#8f6a1f;
    --good-bg:#e4efe4; --bad-bg:#f6e8e8; --warn-bg:#f3ecd9; --code:#eae5d6;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); margin:0;
    font:14.5px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  .shell{display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; max-width:1400px; margin:0 auto;}
  /* sidebar */
  aside{border-right:1px solid var(--line); padding:22px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{padding:0 18px 14px; font-size:16.5px; font-weight:800; letter-spacing:-.2px;}
  .brand small{display:block; color:var(--muted); font-weight:600; font-size:11.5px; margin-top:2px;}
  .gl{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    font-weight:750; padding:14px 18px 4px;}
  aside a{display:flex; justify-content:space-between; gap:8px; padding:7px 15px 7px 18px; color:var(--ink);
    text-decoration:none; font-weight:600; font-size:13.5px; border-left:3px solid transparent; align-items:baseline;}
  aside a:hover{background:var(--chip);}
  aside a.sel{background:var(--sel); border-left-color:var(--accent);}
  aside a .r{color:var(--accent); font-variant-numeric:tabular-nums; font-weight:750; font-size:12.5px;}
  aside a .r.na{color:var(--muted); font-weight:600;}
  /* content */
  .content{padding:26px 30px 70px; min-width:0;}
  h1{font-size:22px; font-weight:800; letter-spacing:-.2px; margin:0 0 2px;}
  .lede{color:var(--muted); margin:4px 0 0; max-width:76ch; font-size:13.8px;}
  .pills{display:inline-flex; gap:6px; flex-wrap:wrap; margin-left:10px; vertical-align:2px;}
  .pill{display:inline-block; padding:1px 10px 2px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap;}
  .pill.good{background:var(--good-bg); color:var(--good);}
  .pill.bad{background:var(--bad-bg); color:var(--bad);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.dim{background:var(--chip); color:var(--muted);}
  /* tabs */
  .tabs{display:flex; gap:2px; margin:20px 0 0; border-bottom:1px solid var(--line);}
  .tabs button{font:700 13.5px/1 inherit; color:var(--muted); background:none; border:none;
    padding:10px 16px 11px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabs button.sel{color:var(--accent-ink); border-bottom-color:var(--accent);}
  .tabbody{padding-top:18px;}
  .seclabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--muted);
    font-weight:750; margin:22px 0 10px;}
  .seclabel:first-child{margin-top:0;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 15px 11px;}
  .card .k{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.4px; color:var(--good);}
  .card .k small{font-size:13px; color:var(--muted); font-weight:650;}
  .card .l{font-size:11.8px; color:var(--muted); margin-top:2px;}
  dl.conds{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px 16px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:0;}
  dt{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:750;}
  dd{margin:2px 0 0; font-size:13px; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px;}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:520px;}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
     text-align:left; font-weight:750; padding:9px 13px 7px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:8px 13px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  td.hl{color:var(--accent-ink); font-weight:750;}
  td .why{color:var(--muted); font-size:12.3px;}
  a.btn{display:inline-block; background:var(--accent); color:#fff; border-radius:8px; padding:8px 15px;
    font-weight:700; font-size:13px; text-decoration:none;}
  a.btn.ghost{background:var(--chip); color:var(--ink);}
  .trajframe{width:100%; height:78vh; border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:12px;}
  .note{font-size:12.3px; color:var(--muted); margin-top:8px; max-width:84ch;}
  @media (max-width:800px){
    .shell{grid-template-columns:1fr;}
    aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); padding-bottom:10px;}
  }
</style>
<div class="shell">
<aside id="nav"></aside>
<div class="content" id="content"></div>
</div>
<script>
/* live numbers: a WSL daemon recomputes dashboard/status.json every 5 min and
   pushes; Vercel redeploys from GitHub; this fetch patches the page on load. */
window.LIVE = null;
function pullLive(){
  fetch("status.json", {cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if (j && JSON.stringify(j) !== JSON.stringify(window.LIVE)){ window.LIVE=j; render(); }
  }).catch(()=>{});
}
pullLive(); setInterval(pullLive, 120000);
function lv(){ const s = window.LIVE && window.LIVE.v11; if(!s || !s.scored) return null;
  return {...s, rate: Math.round(100*s.passed/s.scored)}; }
/* per-run trajectory hosting (separate vercel projects; ALL scored tasks, screenshots recompressed) */
const T = {
  v11:        "traj/v11/index.html",   /* repo-hosted; the 5-min daemon refreshes it with the run */
  v8big:      "https://cua-traj-v8.vercel.app/v8big/index.html",
  v8nt5:      "https://cua-traj-v8.vercel.app/v8nt-opus5/index.html",
  v8nt46:     "https://cua-traj-v8.vercel.app/v8nt-opus46/index.html",
  off361:     "https://cua-traj-official.vercel.app/official361/index.html",
  proxy49:    "https://cua-traj-official.vercel.app/proxy49/index.html",
  v3full:     "https://cua-traj-early.vercel.app/v3full/index.html",
  v3pilot:    "https://cua-traj-early.vercel.app/v3pilot/index.html",
  gen100:     "https://cua-traj-early.vercel.app/gen100/index.html",
  transformed1:"https://cua-traj-early.vercel.app/transformed1/index.html",
  transformed2:"https://cua-traj-early.vercel.app/transformed2/index.html",
};
const P = {good:s=>`<span class="pill good">${s}</span>`, bad:s=>`<span class="pill bad">${s}</span>`,
           warn:s=>`<span class="pill warn">${s}</span>`, dim:s=>`<span class="pill dim">${s}</span>`};
const card = c=>`<div class="card"><div class="k">${c[0]}</div><div class="l">${c[1]}</div></div>`;
const tbl = (heads,rows)=>`<div class="tablewrap"><table><tr>${heads.map(h=>`<th ${h[1]||""}>${h[0]}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r}</tr>`).join("")}</table></div>`;

const VIEWS = [
{id:"all", group:"Results", title:"All Results", rate:"", design:overviewDesign, traj:null},
{id:"v11-500", group:"Current", title:"v11-500 Rollout", rate:"live",
 head:{t:"v11-500 Rollout", pills:[P.good("live"),P.dim("ms50 · think, no preserve")],
   lede:"The same v11 pipeline, scaled: 444 tasks drawn from the same 1300-cell taxonomy with every v11 fix already in force. Numbers below refresh from the lab machine every few minutes."},
 design:()=>{ const s = window.LIVE && window.LIVE.v11_500; const r = s && s.scored; return `
  <div class="seclabel">Results so far${s?` · as of ${window.LIVE.updated}`:""}</div>
  <div class="cards">${(r
     ? [[Math.round(100*s.passed/s.scored)+"%", "pass ("+s.passed+"/"+s.scored+" scored, of "+s.corpus+")"],
        ...Object.entries(s.domains||{}).sort((a,b)=>b[1][1]-a[1][1]).map(([d,v])=>[v[0]+"/"+v[1], d])]
     : [["—","rollout starting"],[s?s.corpus:"444","tasks ready"]]).map(card).join("")}</div>
  <div class="seclabel">Conditions</div>
  <dl class="conds">${conds({corpus:"v11-500 · 444 tasks", generator:"claude-opus-5", "max steps":"100 + WAIT breaker (10)",
      thinking:"on · not preserved", "temp / top-p":"0.6 / 0.95", sleep:"1 s", envs:"3 docker VMs",
      screen:"1920×1080", "result dir":"v11-500-ms100-think-nopreserve"})}</dl>
  <div class="seclabel">How the corpus is designed</div>
  ${tbl([["axis"],["design"]],[
   "<td><b>coordinate draw</b></td><td>intent (5) × domain (13) × difficulty (5) × ambiguity (4); <b>444 tasks in 444 distinct cells</b>, quota charged on keep</td>",
   "<td><b>difficulty</b></td><td>monotone ladder, d3+ crosses an application boundary → 60% cross-app (single 177 · two 206 · three 61)</td>",
   "<td><b>ambiguity</b></td><td>43 explicit · 130 functional · 137 deictic · 134 outcome-only</td>",
   "<td><b>warm start</b></td><td>68% open their workspace in config, near the official family's rate</td>",
   "<td><b>voice</b></td><td>contextful 186 · terse 125 · polite 101 · sloppy 32</td>",
   "<td><b>R + P</b></td><td>fixable gate failures get one ~200-token instruction rewrite then re-gate (setup/probe untouched)</td>"])}
  <div class="seclabel">Pre-run verification — what each layer caught</div>
  ${tbl([["layer"],["scope"],["caught / removed"]],[
   "<td><b>0 · prebuild</b></td><td>160 soffice setups</td><td>all rewritten to host-built base64 fixtures — the compositor bug that cost v11 its calc domain cannot occur here</td>",
   "<td><b>1 · sanitise + gates</b></td><td>472 specs</td><td>5 leaked <code>&lt;/setup&gt;</code> tags (a shell syntax error that builds nothing), 2 browser free-passes, 1 unbuildable fixture</td>",
   "<td><b>2 · similarity</b></td><td>whole corpus</td><td>17 near-duplicates over two iterative rounds</td>",
   "<td><b>3 · defect scan</b></td><td>7 classes, severity-aware</td><td>2 instructions repaired (probe pinned a name the agent was never told), 1 media fixture blocked</td>",
   "<td><b>4 · VM controls</b></td><td>444 tasks, fresh VM each</td><td><b>0 failures</b> — every task builds its start state, shows its workspace, and scores 0 when idle</td>"])}
  <div class="seclabel">Similarity &amp; contamination</div>
  ${tbl([["test"],["worst",'class="num"'],["gate",'class="num"']],[
   `<td>internal jaccard</td><td class="num">0.38</td><td class="num">&lt; 0.40</td>`,
   `<td>internal tf-idf cosine</td><td class="num">0.49</td><td class="num">&lt; 0.50</td>`,
   `<td>vs CUA-Gym (10,909 refs)</td><td class="num">0.47</td><td class="num">&lt; 0.50</td>`,
   `<td>vs official OSWorld-361</td><td class="num">0.46</td><td class="num">&lt; 0.50</td>`,
   `<td>quota drift</td><td class="num">2%</td><td class="num">≤ 2%</td>`])}
  <div class="seclabel">Domain mix</div>
  <p class="note" style="margin-top:0">vs_code 112 · calc 70 · os 63 · impress 55 · chrome 47 · writer 35 · thunderbird 29 · gimp 23 · vlc 10 &nbsp;·&nbsp; grading: probe 371 · table 61 · browser 12</p>`},
 traj:{url:"traj/v11-500/index.html", n:"every scored task, refreshed with the run",
       note:"Step player per task: the model's verbatim thinking, tool calls, executed pyautogui and the VM screenshot at each step."}},
{id:"v11", group:"Current", title:"v11 Rollout", rate:"39%",
 head:{t:"v11 Rollout", pills:[P.good("complete 100/100"),P.dim("ms50 · think, no preserve")],
   lede:"The first corpus rolled end to end: 100 tasks, 39 solved. Its calc domain also produced the run's most expensive lesson — a setup-side compositor bug that made documents invisible to the agent while every window-manager check reported them open."},
 design:()=>{ const s = lv(); return `
  <div class="seclabel">Results so far${s?` · as of ${window.LIVE.updated}`:""}</div>
  <div class="cards">${(s?[[s.rate+"%","pass ("+s.passed+"/"+s.scored+" scored, of "+s.total+")"],
      ...(s.domains?Object.entries(s.domains).map(([d,v])=>[v[0]+"/"+v[1],d]):[])]
    :[["43%","pass (13/30 scored)"],["6/14","multi-app passed"],["7/11","single-app passed"],["3","d5 passes · 34-35 steps"]]).map(card).join("")}</div>
  <div class="seclabel">Conditions</div>
  <dl class="conds">${conds({corpus:"v11 · 100 tasks (92 rolling)",generator:"claude-opus-5","max steps":"50",thinking:"on · not preserved","temp / top-p":"0.6 / 0.95",sleep:"1 s",envs:"3 docker VMs",screen:"1920×1080"})}</dl>
  <div class="seclabel">How the corpus is designed</div>
  ${tbl([["axis"],["design"]],[
   ["<td><b>coordinate draw</b></td><td>intent (5) × domain (13) × difficulty (5) × ambiguity (4); quota charged on keep, so rejections cannot bleed an axis</td>"],
   ["<td><b>difficulty</b></td><td>strictly monotone ladder; d3+ crosses an application boundary → 60% cross-app by quota</td>"],
   ["<td><b>ambiguity</b></td><td>10/30/30/30: explicit → functional (“the rota sheet”) → deictic (workspace pre-opened) → outcome-only; instruction vagueness costs no grading rigor</td>"],
   ["<td><b>warm start</b></td><td>browser/deictic forced warm, files/terminal forced cold, free stratum 65% → lands near official's 85% warm rate</td>"],
   ["<td><b>voice</b></td><td>terse 30 / contextful 35 / polite 25 / sloppy 10; length caps 150/250/300 chars by difficulty</td>"],
   ["<td><b>R + P (new in v11)</b></td><td>fixable gate failures get one ~200-token instruction rewrite then re-gate (setup/probe untouched); per-spec limits inline. <b>7.6 keeps/batch vs v10's 1.9 — 4× on the same seed</b></td>"]])}
  <div class="seclabel">Similarity &amp; contamination (gates the corpus had to pass)</div>
  ${tbl([["test"],["worst value",'class="num"'],["gate",'class="num"'],["meaning"]],[
   `<td>internal jaccard, any task pair</td><td class="num">0.35</td><td class="num">&lt; 0.40</td><td class="why">no two instructions share wording</td>`,
   `<td>internal tf-idf cosine, any pair</td><td class="num">0.49</td><td class="num">&lt; 0.50</td><td class="why">no two tasks are semantic twins (2 over-gate pairs culled pre-ship)</td>`,
   `<td>vs CUA-Gym, 10,909 reference tasks</td><td class="num">0.47</td><td class="num">&lt; 0.50</td><td class="why">no task overlaps the benchmark the SFT model may later be judged on</td>`,
   `<td>vs official OSWorld-361</td><td class="num">0.28</td><td class="num">&lt; 0.50</td><td class="why">no task is a paraphrase of the official corpus</td>`,
   `<td>entity reuse across tasks</td><td class="num">0</td><td class="num">&lt; 3</td><td class="why">no name/company/file recycled through the corpus</td>`])}
  <div class="seclabel">Diversity — how spread the 100 tasks are</div>
  <div class="cards">${[["100/100","distinct coordinate cells — no two tasks share an (intent × domain × difficulty × ambiguity) cell"],["0.81","distinct-bigram ratio (phrasing variety)"],["13","business domains"],["9","applications"],["31","words median · 34% ≤ 25 words"]].map(card).join("")}</div>
  <div class="seclabel">Content mix (actual counts; quota drift ≤ 2%)</div>
  ${tbl([["axis"],["distribution"]],[
   `<td><b>intent</b></td><td>configure 25 · repair 23 · info_seeking 19 · transform 19 · create 14</td>`,
   `<td><b>difficulty</b></td><td>d1 16 · d2 23 · d3 24 · d4 21 · d5 16</td>`,
   `<td><b>ambiguity</b></td><td>explicit 10 · functional 31 · deictic 29 · outcome-only 30 (target 10/30/30/30)</td>`,
   `<td><b>voice</b></td><td>contextful 47 · terse 27 · sloppy 15 · polite 11 (target 35/30/10/25 — polite under-drawn, noted)</td>`,
   `<td><b>apps per task</b></td><td>single 37 · two 48 · three 15 → 63% cross-app</td>`,
   `<td><b>warm start</b></td><td>71% open the workspace in config (official family: 85%)</td>`,
   `<td><b>grading route</b></td><td>probe 84 · table (compare_table) 11 · browser (URL match) 5</td>`,
   `<td><b>business domains</b></td><td>legal 15 · HR 12 · healthcare 10 · research 8 · manufacturing 8 · travel 8 · education 8 · retail 8 · logistics 7 · nonprofit 5 · real-estate 4 · finance 4 · marketing 3</td>`])}
  <div class="seclabel">Pre-run verification — what each layer caught</div>
  ${tbl([["layer"],["scope"],["caught / removed"]],[
   ["<td><b>1 · similarity gates</b></td><td>119 specs</td><td>2 near-duplicates (worst cosine 0.55; one 0.58 vs CUA-Gym)</td>"],
   ["<td><b>2 · grader-defect scan</b></td><td>117 specs</td><td>4 rigid output names · 1 missing source data · 1 dated constant; then quota trim 11 → 100</td>"],
   ["<td><b>3 · VM controls</b></td><td>100 tasks · fresh VM each</td><td>7 impress decks (impossible txt→odp chain → rebuilt as embedded real binaries) · 1 inverted probe passing an empty desktop</td>"],
   ["<td><b>4 · rollout adjudication</b></td><td>every fail, frame-by-frame</td><td>1 agent negation error (legit 0) · 1 harness wrongful conviction (page never opened) · 1 probe world-belief bug — last two patched &amp; requeued</td>"]])}
  <div class="seclabel">The calc incident — worth reading before trusting any green check</div>
  ${tbl([["stage"],["what happened"]],[
   "<td><b>symptom</b></td><td>the whole calc domain scored 0/15, every failure burning the full 50 steps</td>",
   "<td><b>false all-clear</b></td><td>control's window lane reported the documents open: <code>wmctrl</code> and <code>xprop</code> both listed the window as mapped and focused</td>",
   "<td><b>reality</b></td><td>the agent's own screenshot showed a bare desktop. A setup that ran <code>soffice --convert-to</code> leaves the compositor unable to PAINT the window it later opens — existence is not visibility</td>",
   "<td><b>fix</b></td><td>office fixtures are now built host-side and shipped as base64 blobs (no soffice in the VM); control judges visibility from the agent's screenshot</td>",
   "<td><b>proof</b></td><td>after the fix 10/10 rechecked calc tasks showed the document on screen, and the domain scored its first pass</td>"])}
  <div class="seclabel">Domain mix</div>
  <p class="note" style="margin-top:0">vs_code 24 · chrome 20 · calc 15 · os 13 · impress 9 · writer 8 · thunderbird 4 · vlc 4 · gimp 3</p>`},
 traj:{url:T.v11, n:"all scored tasks (refreshed as the run progresses)", note:"Step player per task: the model's verbatim thinking, tool calls, executed pyautogui and the VM screenshot at every step. Recordings stay on the lab machine."}},
{id:"off361", group:"Baseline", title:"OSWorld-Verified 361", rate:"45%",
 head:{t:"OSWorld-Verified 361", pills:[P.warn("312/361 · proxy pending"),P.dim("2026-07-31")],
   lede:"The official benchmark on our serving stack — the anchor every generated corpus is measured against. 45.2% (141/312 non-proxy)."},
 design:()=>`
  <div class="seclabel">Results</div>
  <div class="cards">${[["45%","pass, non-proxy (141/312)"],["1%","of failures loop-locked"],["49","proxy tasks awaiting creds"]].map(card).join("")}</div>
  <div class="seclabel">Conditions</div>
  <dl class="conds">${conds({corpus:"official · 361 tasks","max steps":"50",thinking:"flag sent — later found inert","temp / top-p":"0.6 / 0.95",sleep:"3 s",envs:"1",runner:"run_multienv_qwen.py"})}</dl>
  <div class="seclabel">What this run anchors</div>
  ${tbl([["fact"],["value"]],[
   ["<td><b>thinking caveat</b></td><td>the enable-thinking flag only worked for DashScope URLs and vLLM 0.25 renamed the response field — this campaign ran thinking-blind; all ostg runs since v8big use the fixed stack</td>"],
   ["<td><b>loop-lock baseline</b></td><td>~1% of failures loop here vs 47% on v8 — the official family pre-opens the workspace (85% of tasks); produced v10/v11's warm-start axis</td>"],
   ["<td><b>length law</b></td><td>pass falls with instruction length: 58% at ≤15 words → 16% over 60; produced the v10 prompts-genre rewrite</td>"],
   ["<td><b>domain mix</b></td><td>multi_apps 101 · calc 47 · impress 47 · chrome 46 · gimp 26 · os 24 · writer 23 · vs_code 23 · vlc 17 · thunderbird 15</td>"]])}`,
 traj:{url:T.off361, n:"all 312 scored tasks", note:"Same step player; task chips show the official task ids."}},
{id:"proxy49", group:"Baseline", title:"Proxy-49 · Direct", rate:"11%",
 head:{t:"Proxy-49 — direct connection", pills:[P.dim("experiment"),P.dim("2026-08-08")],
   lede:"The 49 proxy-flagged official tasks run deliberately WITHOUT the residential proxy they declare: 11% (5/45). Quantifies the proxy's worth; fair rerun awaits credentials."},
 design:()=>`
  <div class="seclabel">Results</div>
  <div class="cards">${[["11%","pass without proxy (5/45)"]].map(card).join("")}</div>

let curTab = "design";
function renderNav(sel){
  document.getElementById("nav").innerHTML =
   `<div class="brand">CUA · Task Generation<small>experiments &amp; rollouts dashboard</small></div>` +
   groups.map(g=>{
    const vs = VIEWS.filter(v=>v.group===g);
    return `<div class="gl">${g}</div>` + vs.map(v=>{
      let r = v.rate;
      if (v.id === "v11"){ const s = lv(); r = s ? s.rate + "%" : "live"; }
      return `<a href="#${v.id}" class="${v.id===sel?'sel':''}">${v.title}<span class="r ${r&&r!=="—"?'':'na'}">${r||""}</span></a>`;}).join("");
  }).join("");
}
function render(){
  const id = (location.hash||"#all").slice(1);
  const v = VIEWS.find(x=>x.id===id) || VIEWS[0];
  renderNav(v.id);
  let html = "";
  if (v.id==="all"){
    html = `<h1>Experiments on CUA Task Generation</h1>
      <p class="lede">LLM-generated desktop tasks → layered verification → Qwen3.6-27B rollouts → SFT trajectories. Solver identical everywhere; pass = evaluator score 1.0. Pick a run on the left: each has a <b>Design &amp; Audits</b> tab (how it was built, what was checked before it ran) and a <b>Trajectories</b> tab (the model actually running the tasks, step by step).</p>
      <div class="tabbody">${v.design()}</div>`;
  } else {
    const hasTraj = !!v.traj;
    html = `<h1>${v.head.t}<span class="pills">${v.head.pills.join("")}</span></h1>
      <p class="lede">${v.head.lede}</p>
      <div class="tabs">
        <button class="${curTab==='design'?'sel':''}" onclick="setTab('design')">Design &amp; Audits</button>
        ${hasTraj?`<button class="${curTab==='traj'?'sel':''}" onclick="setTab('traj')">Trajectories</button>`:""}
      </div>
      <div class="tabbody">${curTab==='design'||!hasTraj ? v.design() : trajBody(v.traj)}</div>`;
  }
  document.getElementById("content").innerHTML = html;
}
function trajBody(t){
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <a class="btn" href="${t.url}" target="_blank" rel="noopener">Open full-screen ↗</a>
    ${t.url2?`<a class="btn ghost" href="${t.url2}" target="_blank" rel="noopener">${t.label2} ↗</a>`:""}
    <span class="note" style="margin:0">${t.n}${t.note?" · "+t.note:""}</span></div>
  <iframe class="trajframe" src="${t.url}" loading="lazy"></iframe>`;
}
function setTab(t){curTab=t; render();}
window.addEventListener("hashchange", ()=>{curTab="design"; render();});
