<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiments on CUA Task Generation</title></head><body>

<style>
  :root{
    --bg:#f5f1e8; --surface:#fdfbf6; --ink:#20261f; --muted:#6b7263;
    --accent:#3d6b4f; --accent-ink:#2c5140; --line:#e2ddd0; --chip:#ece7da;
    --sel:#e3ead9; --good:#2e7d4f; --bad:#a83f45; --warn:#8f6a1f;
    --good-bg:#e4efe4; --bad-bg:#f6e8e8; --warn-bg:#f3ecd9; --code:#eae5d6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161a16; --surface:#1e241e; --ink:#e6e9e2; --muted:#9aa392;
      --accent:#7fb894; --accent-ink:#9ccbAb; --line:#2e362d; --chip:#28302a;
      --sel:#26332a; --good:#6cc08b; --bad:#dd8287; --warn:#cfa458;
      --good-bg:#213228; --bad-bg:#342426; --warn-bg:#322b1c; --code:#272e26;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161a16; --surface:#1e241e; --ink:#e6e9e2; --muted:#9aa392;
    --accent:#7fb894; --accent-ink:#9ccbab; --line:#2e362d; --chip:#28302a;
    --sel:#26332a; --good:#6cc08b; --bad:#dd8287; --warn:#cfa458;
    --good-bg:#213228; --bad-bg:#342426; --warn-bg:#322b1c; --code:#272e26;
  }
  :root[data-theme="light"]{
    --bg:#f5f1e8; --surface:#fdfbf6; --ink:#20261f; --muted:#6b7263;
    --accent:#3d6b4f; --accent-ink:#2c5140; --line:#e2ddd0; --chip:#ece7da;
    --sel:#e3ead9; --good:#2e7d4f; --bad:#a83f45; --warn:#8f6a1f;
    --good-bg:#e4efe4; --bad-bg:#f6e8e8; --warn-bg:#f3ecd9; --code:#eae5d6;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); margin:0; padding:0 20px 90px;
    font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  main{max-width:1000px; margin:0 auto;}
  h1{font-size:27px; font-weight:800; letter-spacing:-.3px; margin:36px 0 18px;}
  h2{font-size:19px; font-weight:750; margin:0 0 4px;}
  .seclabel{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    font-weight:750; margin:34px 0 12px;}
  code{background:var(--code); border-radius:4px; padding:1px 6px; font-size:12.5px;}
  /* nav card */
  .nav{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 0 14px; }
  .ng{margin-top:10px;}
  .ng > .gl{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    font-weight:750; padding:6px 20px 4px;}
  .nav a{display:block; padding:8px 20px; color:var(--ink); text-decoration:none;
    font-weight:600; font-size:14.5px; border-left:3px solid transparent;}
  .nav a:hover{background:var(--chip);}
  .nav a.sel{background:var(--sel); border-left-color:var(--accent);}
  .nav a .r{float:right; color:var(--accent); font-variant-numeric:tabular-nums; font-weight:700;}
  .nav a .r.na{color:var(--muted); font-weight:600;}
  /* content blocks */
  .pills{display:inline-flex; gap:6px; flex-wrap:wrap; vertical-align:2px;}
  .pill{display:inline-block; padding:1px 10px 2px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .pill.good{background:var(--good-bg); color:var(--good);}
  .pill.bad{background:var(--bad-bg); color:var(--bad);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.dim{background:var(--chip); color:var(--muted);}
  .lede{color:var(--muted); margin:6px 0 0; max-width:76ch;}
  .story{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 22px;}
  .story .it{display:grid; grid-template-columns:34px 1fr; gap:14px; padding:15px 0; border-bottom:1px solid var(--line);}
  .story .it:last-child{border-bottom:none;}
  .story .n{width:26px; height:26px; border-radius:99px; background:var(--sel); color:var(--accent-ink);
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .story b.t{display:block; font-size:14.5px; margin-bottom:3px;}
  .story p{margin:0; color:var(--muted); font-size:13.8px;}
  .story p b{color:var(--ink);}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px 13px;}
  .card .k{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; color:var(--good);}
  .card .k small{font-size:15px; color:var(--muted); font-weight:650;}
  .card .k.neutral{color:var(--ink);}
  .card .l{font-size:12.3px; color:var(--muted); margin-top:3px;}
  .card .chipline{margin-top:6px;}
  dl.conds{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px 18px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:0;}
  dt{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:750;}
  dd{margin:2px 0 0; font-size:13.8px; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px;}
  table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:600px;}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
     text-align:left; font-weight:700; padding:10px 14px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  td.hl{color:var(--accent-ink); font-weight:700;}
  .btns{display:flex; gap:10px; flex-wrap:wrap;}
  a.btn{display:inline-block; background:var(--accent); color:#fff; border-radius:8px; padding:9px 16px;
    font-weight:700; font-size:13.5px; text-decoration:none;}
  :root[data-theme="dark"] a.btn, .darkbtn{color:#10140f;}
  a.btn.ghost{background:var(--chip); color:var(--ink); font-weight:650;}
  .note{font-size:12.7px; color:var(--muted); margin-top:10px; max-width:82ch;}
  footer{margin-top:60px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--muted); display:flex; gap:18px; flex-wrap:wrap;}
  @media (max-width:640px){ .story .it{grid-template-columns:28px 1fr;} }
</style>
<main>
  <h1>Experiments on CUA Task Generation</h1>
  <div class="nav" id="nav"></div>
  <div id="content"></div>
  <footer>
    <span>solver: Qwen3.6-27B BF16 · vLLM · Tillicum H200 · OSWorld docker VMs</span>
    <span>repo: github.com/DengDuangLang111/CUA (private)</span>
    <span>updated 2026-08-10 01:10 PT</span>
    <span>contact: jy050706@uw.edu</span>
  </footer>
</main>
<script>
const TRAJ = "https://cua-dashboard-theta.vercel.app/traj/v11/index.html";
const P = {good:s=>`<span class="pill good">${s}</span>`, bad:s=>`<span class="pill bad">${s}</span>`,
           warn:s=>`<span class="pill warn">${s}</span>`, dim:s=>`<span class="pill dim">${s}</span>`};
const VIEWS = [
{id:"all", group:"Results", title:"All Results", rate:null, render:allResults},
{id:"v11", group:"Current", title:"v11 Rollout", rate:"43%", render:()=>runView({
  title:"v11 Rollout — the standard corpus, live",
  pills:[P.good("live"), P.dim("2026-08-09 →")],
  lede:"100 tasks after four verification layers; 92 rolling now at the official 50-step budget with thinking captured but not preserved. The 10 repaired tasks re-enter automatically when the run ends.",
  story:[
   ["Why v11 exists","v10 proved the design (prompts-genre instructions, ambiguity axis, warm-start, 60% cross-app) but paid <b>144 gate rejections for 70 keeps</b>. v11 adds R+P: a failing-but-fixable spec gets one ~200-token instruction rewrite and re-gates — setup, probe and coordinates are never touched. Same seed and command as v10: <b>7.6 keeps/batch vs 1.9 (4×)</b>."],
   ["What was verified before any VM time","Similarity + contamination gates culled 2 near-duplicates; a grader-defect scan culled 6 (rigid output names, missing source data, a hard-coded year against “this year”); largest-remainder trim to 100 kept quota drift at 2%."],
   ["What VM controls caught","8 of 100 removed: 7 impress decks whose setup used a conversion that exists on no machine (txt→odp — Writer has no presentation export), rebuilt as prebuilt real .odp binaries embedded base64; and 1 probe with an inverted ternary that passed an empty desktop — the exact free-pass class controls exist for."],
   ["What rollout adjudication found","Every failure so far classifies: 6 loop-locked + 3 step-cap (model capability), 1 environment flake, 1 genuine agent negation error, and two wrongful convictions — a warm-start page that never opened (harness) and a probe that mis-assumed Chrome's factory default (world-belief). Both patched and requeued."],
   ["Early signal","43% overall at this snapshot vs 24% for v8 on the same model — and d5 tasks are passing with 34-35-step chains. Multi-app 43% vs single-app 64%. Loop-lock persisting under no-preserve weakens the “preserve cements loops” hypothesis."]],
  conds:{"corpus":"v11 · 100 tasks (92 rolling)","max steps":"50","thinking":"on · not preserved","temp / top-p":"0.6 / 0.95","sleep":"1 s","envs":"3 docker VMs","screen":"1920×1080","result dir":"v11-all-ms50-think-nopreserve-20260809"},
  cards:[["43%","pass rate (13 of 30 scored)"],["30<small>/92</small>","scored so far"],["6/14","multi-app passed"],["7/11","single-app passed"],["3","d5 passes (34-35 steps)"]],
  domains:"vs_code 24 · chrome 20 · calc 15 · os 13 · writer 7 · thunderbird 4 · vlc 4 · gimp 3 · impress 2 (+7 repaired queued)",
  traj:{href:TRAJ, label:"Open trajectory viewer — 10-task sample", note:"Step-by-step player with the model's verbatim thinking, actions and executed code per step. Sample includes: 3 d5/d4 passes (34-35 step chains), the three adjudicated chrome cases, a loop-lock specimen, and quick passes. Full 92-task set + recordings live on the lab machine."}})},
{id:"off361", group:"Baseline", title:"OSWorld-Verified 361", rate:"45%", render:()=>runView({
  title:"Official OSWorld-Verified — the benchmark anchor",
  pills:[P.warn("312/361 · proxy tasks pending"), P.dim("2026-07-31")],
  lede:"The official 361-task benchmark on our exact serving stack. Everything the generated corpora are measured against.",
  story:[
   ["Result","<b>45.2%</b> on the 312 non-proxy tasks (141 passed). The 49 proxy-flagged tasks (Amazon, Delta, TripAdvisor…) need residential-proxy credentials and remain queued."],
   ["Thinking was silently off","Discovered a week later: the agent's enable-thinking flag only worked for DashScope base URLs and vLLM 0.25 had renamed the response field — this campaign ran thinking-blind. Every ostg run from v8big on has the fixed stack."],
   ["What it taught the corpus design","Loop-lock is ~1% of failures here vs 47% on v8 — the official family pre-opens the workspace (85% of tasks), which produced v10/v11's warm-start axis. And pass rate falls monotonically with instruction length (58% at ≤15 words → 16% over 60) — which produced the prompts-genre rewrite."]],
  conds:{"corpus":"official OSWorld-Verified · 361","max steps":"50","thinking":"flag sent, inert (see story)","temp / top-p":"0.6 / 0.95","sleep":"3 s","envs":"1","runner":"run_multienv_qwen.py"},
  cards:[["45%","pass, non-proxy (141/312)"],["1%","of failures loop-locked"],["49","proxy tasks pending creds"]],
  domains:"multi_apps 101 · calc 47 · impress 47 · chrome 46 · gimp 26 · os 24 · writer 23 · vs_code 23 · vlc 17 · thunderbird 15",
  traj:{note:"Trajectories on the lab machine (312 task dirs with recordings); viewer sample on request."}})},
{id:"proxy49", group:"Baseline", title:"Proxy-49 · Direct Connection", rate:"11%", render:()=>runView({
  title:"Proxy-49 — what happens without the proxy",
  pills:[P.dim("experiment"), P.dim("2026-08-08")],
  lede:"The 49 proxy-flagged official tasks run deliberately WITHOUT the residential proxy they declare.",
  story:[["Result and reading","5 of 45 scored (11%). Consistent with datacenter-IP bot-walls and geo-blocks rather than model ability — the control that quantifies how much the proxy matters. A fair rerun waits on credentials."]],
  conds:{"corpus":"49 proxy-flagged official tasks","max steps":"50","proxy":"none — deliberate","temp / top-p":"0.6 / 0.95"},
  cards:[["11%","pass without proxy (5/45)"]],
  traj:{note:"Trajectories on the lab machine."}})},
{id:"v8big", group:"v8 era", title:"v8big · Preserve-Thinking", rate:"24%", render:()=>runView({
  title:"v8big — 203 self-contained tasks, preserve-thinking, 100 steps",
  pills:[P.warn("stopped 99/203 · resumable"), P.dim("2026-08-09")],
  lede:"The first big generated-corpus rollout with real thinking captured. Stopped deliberately at 99 scored to hand the VMs to the v11 chain; a same-result_dir relaunch resumes it any time.",
  story:[
   ["Result","24% at stop (24/99). Contrast with official 45% under the same solver."],
   ["The loop-lock number","<b>47% of failures were byte-identical response loops</b> burned to the 100-step cap, vs ~1% on official — the observation behind the warm-start axis and this week's preserve/no-preserve A/B."],
   ["The instruction finding","v8 instructions ran median 53 words with 87% absolute paths — a colleague's memo, not a user's prompt. At matched lengths v8 and official pass equally, so the corpus gap was length mix, not grading strictness. This produced v9 → v10 → v11."],
   ["First real thinking","99.7% of calls carried reasoning after the enable_thinking/chat_template_kwargs and reasoning-field fixes; qwen thinks in Chinese ~58% of the time (native drift, not translation)."]],
  conds:{"corpus":"v8 · 203 tasks · 3 grading routes","max steps":"100","thinking":"on · preserved across turns","temp / top-p":"0.6 / 0.95","sleep":"1 s","envs":"3 docker VMs"},
  cards:[["24%","pass at stop (24/99)"],["47%","of fails loop-locked"],["99.7%","calls with captured thinking"]],
  domains:"vs_code 44 · calc 34 · os 32 · chrome 30 · impress 16 · writer 16 · thunderbird 13 · vlc 10 · gimp 8",
  traj:{note:"99 task dirs with recordings on the lab machine; the v11 sample viewer shows the same player UI."}})},
{id:"v8nt", group:"v8 era", title:"Generator A/B Pilots", rate:"—", render:()=>runView({
  title:"v8nt pilots — which LLM writes better tasks?",
  pills:[P.dim("stopped for audit-based comparison"), P.dim("2026-08-09")],
  lede:"Two small corpora identical in protocol, differing only in the model that WROTE the tasks: Opus 5 vs Opus 4.6. Solver fixed (qwen), thinking off, 50 steps.",
  story:[
   ["Why raw pass rates mislead here","Opus-5 corpus: 3/9. Opus-4.6 corpus: 4/8. But the 4.6 corpus graded measurably softer — pass rate confounds task quality with grader strictness."],
   ["The audit settled it","Under a fixed third-party judge (sonnet-4.6) reviewing instruction↔grader coverage, the Opus 5 corpus carried <b>~1.5× fewer coverage gaps per task</b> (2.0 vs 3.1). Opus 5 remained the generator for v9–v11."]],
  conds:{"corpora":"20 (Opus 5) / 23 (Opus 4.6)","max steps":"50","thinking":"off","temp / top-p":"0.6 / 0.95"},
  cards:[["2.0","coverage gaps/task · Opus 5"],["3.1","coverage gaps/task · Opus 4.6"],["1.5×","fewer defects, Opus 5"]],
  traj:{note:"Pilot trajectories on the lab machine."}})},
{id:"corpusonly", group:"Corpus-only", title:"v10 & v9 (no VM run)", rate:"—", render:()=>runView({
  title:"v10 and v9 — designed, gated, never rolled",
  pills:[P.dim("v10: control group"), P.dim("v9: superseded")],
  lede:"Two corpus generations that shaped v11 without spending VM time.",
  story:[
   ["v9 — ambiguity + voice (213 specs)","Added the 4-level ambiguity axis and voice registers to the coordinate product. Superseded the same day: instructions were still long, and the warm-start finding landed."],
   ["v10 — the genre pivot (70 tasks)","Instructions became prompts a user types AT an agent; warm-start axis; strictly monotone difficulty with 60% cross-app. All gates green (best bigram diversity 0.88 — survivorship of 144 rejections). Retired to generation-economics control group for the v11 R+P comparison."]],
  conds:{"v9":"213 specs · superseded pre-VM","v10":"70 tasks · all gates green","v10 yield":"1.9 keeps/batch · 144 rejections","v11 yield (same seed)":"7.6 keeps/batch · 26 hard skips"},
  cards:[["4×","v11 yield vs v10"],["0.88","v10 bigram diversity (best)"],["1%","v11 quota drift (vs 4%)"]],
  traj:{note:"No VM runs — nothing to view."}})},
{id:"v3", group:"Early", title:"v3 Corpus", rate:"35%", render:()=>runView({
  title:"v3 — the taxonomy pipeline proven end-to-end",
  pills:[P.good("complete 74/74"), P.dim("2026-08-08")],
  lede:"The first full run of the coordinate-taxonomy generator, before self-containment.",
  story:[["Result and role","26/74 (35%) at 100 steps, thinking off (pre-fix stack). Proved the intent×domain×difficulty draw and exposed the first wave of grader bugs; v8 rebuilt the idea self-contained at 3× the size. A 5-task wiring pilot (1/5) preceded it."]],
  conds:{"corpus":"v3 taxonomy · 74 tasks","max steps":"100","thinking":"off (pre-fix)","temp / top-p":"0.6 / 0.95"},
  cards:[["35%","pass (26/74)"]],
  traj:{note:"Trajectories on the lab machine."}})},
{id:"legacy", group:"Early", title:"Legacy Pipelines", rate:"—", render:()=>runView({
  title:"Legacy — the pre-ostg experiments",
  pills:[P.dim("superseded")],
  lede:"Everything before the current generator line, kept for the record.",
  story:[
   ["generated-trajectory-100 (60%, 115/191)","The old taskgen pipeline. High pass rate, but tasks depended on a host build tree (not portable) and predate every verification layer — the 60% is not comparable to the self-contained line."],
   ["transformed-osworld batches (13/19)","Early direction: machine-transform official tasks into variants (batches 001/002, incl. an authenticated-sites batch). Dropped in favor of generating fresh tasks with own graders."],
   ["Wiring smokes","ostg-v1-r1 (4/7), taskgen-v6/v8 smokes (0/6), payroll pilot (1/1). No conclusions drawn from n≤7."]],
  conds:{"period":"2026-07 → 08-08","pipelines":"taskgen (legacy) · transforms · ostg v1"},
  cards:[["60%","legacy taskgen (115/191)"],["13/19","transformed batches"]],
  traj:{note:"Archived on the lab machine."}})},
];
function pillsRow(ps){return `<span class="pills">${ps.join("")}</span>`}
function runView(v){
  return `
  <div class="seclabel">Run</div>
  <h2>${v.title}</h2>
  <div style="margin-top:6px">${pillsRow(v.pills)}</div>
  <p class="lede">${v.lede}</p>
  <div class="seclabel">Narrative</div>
  <div class="story">${v.story.map((s,i)=>`<div class="it"><div class="n">${i+1}</div><div><b class="t">${s[0]}</b><p>${s[1]}</p></div></div>`).join("")}</div>
  <div class="seclabel">Conditions</div>
  <dl class="conds">${Object.entries(v.conds).map(([k,x])=>`<div><dt>${k}</dt><dd>${x}</dd></div>`).join("")}</dl>
  <div class="seclabel">Headline metrics</div>
  <div class="cards">${v.cards.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="l">${c[1]}</div></div>`).join("")}</div>
  ${v.domains?`<div class="seclabel">Domain mix</div><p class="note" style="margin-top:0">${v.domains}</p>`:""}
  <div class="seclabel">Trajectories</div>
  ${v.traj.href?`<div class="btns"><a class="btn" href="${v.traj.href}">${v.traj.label}</a></div>`:""}
  <p class="note">${v.traj.note}</p>`;
}
function allResults(){
  const rows = [
   ["v11 rollout","v11 · 100 (92 rolling)","ms50 · think, no preserve · sleep 1 · 3 envs","30","13","43%","live"],
   ["OSWorld-Verified 361","official · 361","ms50 · thinking inert · sleep 3 · 1 env","312","141","45%","proxy tasks pending"],
   ["Proxy-49 direct","official proxy subset · 49","ms50 · no proxy (deliberate)","45","5","11%","experiment"],
   ["v8big","v8 · 203","ms100 · think, preserve · sleep 1 · 3 envs","99","24","24%","stopped · resumable"],
   ["v8nt · Opus 5 tasks","v8-style · 20","ms50 · thinking off","9","3","33%","stopped"],
   ["v8nt · Opus 4.6 tasks","v8-style · 23","ms50 · thinking off","8","4","50%","stopped"],
   ["v10","70 tasks","no VM run — generation control group","—","—","—","control group"],
   ["v9","213 specs","no VM run — superseded","—","—","—","superseded"],
   ["v3full","v3 · 74","ms100 · thinking off","74","26","35%","complete"],
   ["v3 pilot","v3 · 5","ms100 · thinking off","5","1","20%","smoke"],
   ["generated-trajectory-100","legacy taskgen · ~100","legacy protocol · thinking off","191","115","60%","complete (not comparable)"],
   ["transformed-osworld","transformed · 19","batches 001/002","19","13","68%","dropped direction"],
   ["early smokes","assorted · 13","wiring checks","12","5","—","smoke"],
  ];
  return `
  <div class="seclabel">Overview</div>
  <h2>Every run on record</h2>
  <p class="lede">LLM-generated desktop tasks, verified layer by layer, rolled out on Qwen3.6-27B inside OSWorld docker VMs — successful trajectories become SFT data. Solver identical everywhere; pass = evaluator score 1.0. Select a run on the left-hand list above for its narrative, exact conditions and trajectory viewer.</p>
  <div class="seclabel">Headline metrics</div>
  <div class="cards">
    <div class="card"><div class="k">43%</div><div class="l">v11 rollout, live (30/92) — vs 24% for v8 on the same model</div></div>
    <div class="card"><div class="k">45%</div><div class="l">official OSWorld-Verified anchor (312 scored)</div></div>
    <div class="card"><div class="k">4×</div><div class="l">v11 generation yield vs v10, same seed</div></div>
    <div class="card"><div class="k">18</div><div class="l">runs on record — all in this table</div></div>
  </div>
  <div class="seclabel">All runs</div>
  <div class="tablewrap"><table>
    <tr><th>run</th><th>corpus</th><th>conditions</th><th class="num">scored</th><th class="num">passed</th><th class="num">rate</th><th>status</th></tr>
    ${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td style="color:var(--muted)">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="num hl">${r[5]}</td><td style="color:var(--muted)">${r[6]}</td></tr>`).join("")}
  </table></div>
  <div class="seclabel">Instruction-shape yardstick</div>
  <div class="tablewrap"><table>
    <tr><th>metric</th><th class="num">v8 (192)</th><th class="num">v10 (70)</th><th class="num">v11 (100)</th><th class="num">official 361</th></tr>
    <tr><td>words, median</td><td class="num">53</td><td class="num">29</td><td class="num hl">31</td><td class="num">26</td></tr>
    <tr><td>≤ 25 words</td><td class="num">1%</td><td class="num">—</td><td class="num hl">34%</td><td class="num">~50%</td></tr>
    <tr><td>absolute path in instruction</td><td class="num">87%</td><td class="num">—</td><td class="num hl">8%</td><td class="num">5%</td></tr>

       ["Official pre-opens the workspace","85% of OSWorld-Verified and 82% of OSWorld-V2 launch or open the app in config (impress: 47/47). Produced the warm-start axis."],

const groups = ["Results","Current","Baseline","v8 era","Corpus-only","Early"];
function renderNav(sel){
  document.getElementById("nav").innerHTML = groups.map(g=>{
    const vs = VIEWS.filter(v=>v.group===g);
    return `<div class="ng"><div class="gl">${g}</div>` + vs.map(v=>
      `<a href="#${v.id}" class="${v.id===sel?'sel':''}">${v.title}${v.rate?`<span class="r">${v.rate}</span>`:`<span class="r na">${v.id==='all'?'':'—'}</span>`}</a>`).join("") + `</div>`;
  }).join("");
}
function route(){
  const id = (location.hash||"#all").slice(1);
  const v = VIEWS.find(x=>x.id===id) || VIEWS[0];
  renderNav(v.id);
  document.getElementById("content").innerHTML = v.render();
}
window.addEventListener("hashchange", route);
route();
</script>
