meline{display:flex;gap:5px;overflow:auto;padding:7px 2px}.tick{flex:0 0 auto;padding:5px 8px;font:12px ui-monospace,monospace}.detail{overflow:auto;background:white;padding:20px 24px;min-width:0}.detail h2{font-size:19px;margin:0 0 5px}.detail h3{font-size:14px;margin:18px 0 10px}.quiet{font-size:12px;color:var(--muted)}#selection-meta{margin:0 0 12px}.visits{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}.visits button{font-size:12px}.navigation{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}.navigation strong{margin-right:auto}.section{padding-top:14px;margin-top:16px;border-top:1px solid var(--line)}.shot-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0}.shots{display:grid;grid-template-columns:1fr;gap:12px}.shots.compare{grid-template-columns:1fr 1fr}figure{margin:0;min-width:0}.canvas{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#eee;cursor:zoom-in}.canvas img{display:block;width:100%;height:auto}.canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}figcaption{color:var(--muted);font-size:12px;margin-top:6px}.missing{background:var(--soft);border:1px dashed var(--line);padding:24px;font-size:13px;color:var(--muted)}pre{font:12px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:13px;border:1px solid #e8e8e4;border-radius:6px;max-height:330px;overflow:auto;margin:8px 0}.tabs{display:flex;gap:6px;margin:15px 0 10px}.tabs button{font-size:12px}.text-panels>section[hidden]{display:none}.signal-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.signal-images{display:flex;gap:9px;overflow:auto;padding:10px 2px}.signal-images button{flex:0 0 120px;padding:5px;font-size:11px}.signal-images img{width:100%;height:72px;object-fit:contain;display:block}.table-wrap{overflow:auto;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:12px <body>
<header><div class="topbar"><h1>轨迹调试器</h1><span class="meta" id="run-meta"></span><button id="jump-signals">图片 / Attention 热力图</button><button id="jump-records">完整记录清单</button><button id="jump-evaluation">最终评测 / 最后一步</button><a id="download-json" download>原始 JSON ↓</a></div><div class="instruction"><strong>Instruction</strong><p id="instruction"></p></div><nav class="task-navigation" aria-label="任务导航"><button id="back-page">← 返回</button><a id="return-index" href="index.html">返回列表</a><span id="task-position" class="quiet"></span><button id="previous-task" disabled>← 上一个任务</button><button id="next-task" disabled>下一个任务 →</button></nav></header>
<main class="workspace">
<section class="graph-panel" aria-label="轨迹流程图"><div class="toolbar"><label>Episode <select id="episode" aria-label="Episode"></select></label><label>节点合并 <select id="grouping" aria-label="节点合并"><option value="action">相同指令 + 应用</option><option value="state">完全相同的画面 + 应用</option><option value="steps">展开每一次执行</option></select></label><button id="zoom-out" aria-label="缩小流程图">−</button><button id="zoom-in" aria-label="放大流程图">＋</button><button id="fit">适合宽度</button><button id="download-svg">导出图</button></div><p id="graph-help" class="graph-help"></p><div id="graph-scroll"><svg id="graph" role="group" aria-label="带回边的完整轨迹图"></svg></div><div class="timeline-wrap"><small>原始执行顺序 · 点击序号定位具体一次执行</small><div id="timeline"></div></div></section>
<article class="detail" id="detail"><h2 id="node-title"></h2><p class="quiet" id="selection-meta"></p><div id="visits" class="visits"></div><div class="navigation"><strong id="position"></strong><button id="previous">← 上一次执行</button><button id="next">下一次执行 →</button></div><div class="shot-controls"><button data-mode="before">执行前</button><button data-mode="compare">前后对照</button><button data-mode="after">执行后</button><label><input id="show-marks" type="checkbox" checked> 标注执行动作</label></div><div id="shots" class="shots compare"></div><section id="evaluation" class="section" hidden></section><h3>实际执行动作</h3><pre id="action"></pre><p class="quiet" id="coordinates"></p><div class="tabs"><button data-text="thinking" class="active">Thinking（原始）</button><button data-text="prediction">Prediction / 完整回复</button><button data-text="raw">原始动作 / Tool reply</button></div><div class="text-panels"><section id="panel-thinking"><pre id="thinking"></pre></section><section id="panel-prediction" hidden><pre id="prediction"></pre></section><section id="panel-raw" hidden><pre id="raw-action"></pre></section></div><section class="section" id="signals"><h3>Visual signals · 当前模型决策的真实输入</h3><div id="signal-content"></div></section><details class="raw-details"><summary>运行参数与数据来源</summary><pre id="run-raw"></pre></details></article>
</main>
<dialog id="zoom-dialog"><div class="dialog-bar"><strong id="zoom-title"></strong><button id="close-zoom">关闭</button></div><div id="zoom-content"></div></dialog>

async function artifactBytes(ref){

  try{const response=await fetch('index.json',{cache:'no-store'});if(!response.ok)throw Error('Index unavailable');const index=await response.json(),byTask=new Map();

  const item=context.items[next];$(id).disabled=!item;if(item){$(id).title=item.label;$(id).onclick=()=>location.assign(item.url);}

  sessionStorage.setItem('cua-trajectory-navigation',JSON.stringify(context));
  if(context.fromIndex){const saved=JSON.parse(sessionStorage.getItem(context.indexKey||'cua-trajectory-index-eval')||'{}');saved.anchor=context.items[position].url;sessionStorage.setItem(context.indexKey||'cua-trajectory-index-eval',JSON.stringify(saved));}

function setHash(){const row=current()?.frame.signals?.attention?.[state.signalRow]||state.pendingOutput;history.replaceState(null,'','#'+new URLSearchParams({episode:String(episode().trace.episode),occurrence:String(state.occurrence),group:state.mode,attention:state.attentionMode,scale:state.heatScale,grid:state.heatGrid?'1':'0',opacity:String(state.heatOpacity),...(state.panel?{panel:state.panel}:{}),...(row?.output_index!=null?{output:String(row.output_index),layer:String(row.layer),head:String(row.head)}:{})}));}
function selectOccurrence(index,focusGraph=false){state.occurrence=Math.max(0,Math.min(graph().occurrences.length-1,index));state.signalRow=0;state.signalImage=0;state.pendingOutput=null;drawGraph();drawDetail();$('detail').scrollTop=0;setHash();if(focusGraph){const n=$('graph').querySelector('[data-node="'+graph().route[state.occurrence]+'"]');n?.scrollIntoView({block:'nearest',inline:'nearest'});}}
function drawGraph(){

  if(edge.source===edge.target){d=`M ${x+w} ${y-16} C ${x+w+105} ${y-70} ${x+w+105} ${y+70} ${x+w} ${y+16}`;lx=x+w+70;ly=y;}
  else if(edge.target===edge.source+1){d=`M ${x+w/2} ${y+35} L ${x+w/2} ${ty-35}`;lx=x+w/2+12;ly=(y+ty)/2;}

function markerOverlay(action,width,height){

 (action.markers||[]).forEach((m,i)=>{const group=svgEl('g',{},s);const title=svgEl('title',{},group);title.textContent=`${m.label}: (${m.x}, ${m.y})`;
